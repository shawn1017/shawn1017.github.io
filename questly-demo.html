.fx-slidein { animation: slideInRight .32s var(--e-out) both; }
@keyframes slideInRight { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
.fx-correct { animation: flashOk .6s var(--e-out); }
@keyframes flashOk { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,.5); } 100% { box-shadow: 0 0 0 14px rgba(16,185,129,0); } }
.fx-wrong { animation: flashNo .6s var(--e-out); }
@keyframes flashNo { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,.5); } 100% { box-shadow: 0 0 0 14px rgba(239,68,68,0); } }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1180px) {
  .nav__pill { right: 8px; top: 9px; transform: none; }
}

@media (max-width: 900px) {
  .exam-grid { grid-template-columns: minmax(0, 1fr); }
  .exam-grid__side { position: static; }
}

@media (max-width: 760px) {
  .exam-hero { padding: 20px 18px; border-radius: var(--r-lg); }
  .exam-hero__title { font-size: 18px; }
  .exam-hero__actions { gap: 8px; }
  .exam-hero__actions .btn { min-width: 0; padding-left: 10px; padding-right: 10px; font-size: 13px; }
  .exam-hero__stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .exam-stat {
    min-width: 0;
    flex: none;
    padding: 10px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 64px;
  }
  .exam-stat b { font-size: 16px; line-height: 1.25; }
  .exam-stat span { font-size: 10.5px; margin-top: 3px; }
  .exam-plan__grid { grid-template-columns: repeat(2, 1fr); }
  .exam-levels { grid-template-columns: 1fr; }
  .exam-levels--mini { grid-template-columns: repeat(2, 1fr); }
  .exam-ach { grid-template-columns: repeat(3, 1fr); }
  .exam-quicks { grid-template-columns: repeat(2, 1fr); }
  .settle__grid { gap: 6px; }
  .play { padding: 12px 13px calc(14px + env(safe-area-inset-bottom, 0px)); }
  .play__bar { flex-wrap: wrap; }
  .play__nums { width: 100%; justify-content: space-between; }
  .modal--lg, .exam-quick { width: 100%; max-height: 90vh; border-radius: var(--r-xl) var(--r-xl) 0 0; }
  .overlay--center { align-items: flex-end; padding: 0; }
}

@media (max-width: 420px) {
  .exam-quicks { grid-template-columns: repeat(2, 1fr); }
  .exam-ach { grid-template-columns: repeat(2, 1fr); }
  .play__opt { padding: 13px 13px; }
  .play__opt-t { font-size: 13.5px; }
}

/* ─────────── 融合卡片（首页 / 成长 / 复盘） ─────────── */
.exam-fuse { border-color: rgba(99,102,241,.18); background: linear-gradient(160deg, #fff, #FAF9FF); }
.exam-fuse__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.exam-fuse__row .t-sm { color: var(--text-3); font-size: 12.5px; }
.exam-fuse__row b { font-size: 13.5px; font-weight: 720; }
.exam-fuse__bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
.exam-fuse__bar i { display: block; height: 100%; border-radius: 99px; background: var(--grad-brand); box-shadow: 0 0 10px rgba(99,102,241,.3); transition: width .8s var(--e-out); }
.exam-fuse__cta { margin-top: 16px; }

.exam-titles__label { font-size: 11.5px; color: var(--text-3); margin: 14px 0 8px; font-weight: 640; }
.exam-titles { display: flex; flex-wrap: wrap; gap: 6px; }
.exam-title {
  padding: 4px 11px;
  border-radius: var(--r-full);
  background: var(--surface-3);
  color: var(--text-3);
  font-size: 11.5px;
  font-weight: 620;
  white-space: nowrap;
  transition: all var(--t-fast);
}
.exam-title.is-on {
  background: var(--grad-brand);
  color: #fff;
  box-shadow: var(--sh-brand);
}

.exam-review__grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 12px;
}
.exam-review__grid > div { padding: 10px 6px; border-radius: var(--r-md); background: var(--surface-2); text-align: center; }
.exam-review__grid b { display: block; font-size: 16px; font-weight: 760; font-variant-numeric: tabular-nums; }
.exam-review__grid span { font-size: 10.5px; color: var(--text-3); }

@media (max-width: 760px) {
  .exam-review__grid { grid-template-columns: repeat(2, 1fr); }
}

/* === */
/* ============================================================
   animations.css — 关键帧与游戏化特效
   ============================================================ */

/* ---------- ambient ---------- */
@keyframes floatA {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(70px, 50px) scale(1.12); }
}
@keyframes floatB {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(-60px, 70px) scale(1.08); }
}
@keyframes floatC {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50%      { transform: translate(50px, -60px) scale(1.14); }
}
@keyframes heroSweep {
  to { transform: rotate(1turn); }
}
@keyframes shimmer {
  0%   { background-position: 220% 0; }
  100% { background-position: -60% 0; }
}
@keyframes orbPulse {
  0%, 100% { box-shadow: 0 6px 18px rgba(99,102,241,.28), 0 0 0 0 rgba(139,92,246,.34); }
  50%      { box-shadow: 0 6px 18px rgba(99,102,241,.28), 0 0 0 8px rgba(139,92,246,0); }
}
@keyframes pulseDot {
  0%, 100% { transform: translateY(-50%) scale(1); opacity: 1; }
  50%      { transform: translateY(-50%) scale(1.28); opacity: .72; }
}

/* ---------- page / element entry ---------- */
@keyframes pageIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: none; }
}
@keyframes dropIn {
  from { opacity: 0; transform: scaleX(.6); }
  to   { opacity: 1; transform: none; }
}
@keyframes barGrow {
  from { height: 4px !important; opacity: .3; }
}

/* staggered list entry */
.stagger > * { animation: fadeUp .42s var(--e-out) both; }
.stagger > *:nth-child(1) { animation-delay: .02s; }
.stagger > *:nth-child(2) { animation-delay: .06s; }
.stagger > *:nth-child(3) { animation-delay: .10s; }
.stagger > *:nth-child(4) { animation-delay: .14s; }
.stagger > *:nth-child(5) { animation-delay: .18s; }
.stagger > *:nth-child(6) { animation-delay: .22s; }
.stagger > *:nth-child(7) { animation-delay: .26s; }
.stagger > *:nth-child(8) { animation-delay: .30s; }
.stagger > *:nth-child(n+9) { animation-delay: .34s; }

/* ---------- overlays ---------- */
@keyframes overlayIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes overlayOut { from { opacity: 1; } to { opacity: 0; } }
@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(.96); }
  to   { opacity: 1; transform: none; }
}
@keyframes modalOut {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translateY(8px) scale(.98); }
}
@keyframes sheetIn {
  from { transform: translateY(100%); }
  to   { transform: none; }
}
@keyframes sheetOut {
  from { transform: none; }
  to   { transform: translateY(100%); }
}
@keyframes toastIn {
  from { opacity: 0; transform: translateY(18px) scale(.94); }
  to   { opacity: 1; transform: none; }
}
@keyframes toastOut {
  from { opacity: 1; transform: none; }
  to   { opacity: 0; transform: translateY(10px) scale(.96); }
}
@keyframes celebrateIn {
  0%   { opacity: 0; transform: scale(.72) translateY(24px); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: none; }
}
@keyframes trophyPop {
  0%   { transform: scale(0) rotate(-28deg); }
  55%  { transform: scale(1.28) rotate(9deg); }
  75%  { transform: scale(.94) rotate(-4deg); }
  100% { transform: scale(1) rotate(0); }
}

/* ============================================================
   ⚔️  完成任务 = 击败一个小怪
   ============================================================ */

/* 卡片缩小 + 绿色完成光效 */
.task.fx-defeat {
  animation: defeat .62s var(--e-out) forwards;
  z-index: 2;
}
@keyframes defeat {
  0%   { transform: scale(1); box-shadow: var(--sh-xs); }
  16%  { transform: scale(1.028); box-shadow: 0 0 0 3px rgba(16,185,129,.26), 0 10px 26px rgba(16,185,129,.24); }
  46%  { transform: scale(.955); box-shadow: 0 0 0 8px rgba(16,185,129,.10), 0 6px 18px rgba(16,185,129,.16); }
  100% { transform: scale(1); box-shadow: none; }
}

/* 绿色光效横扫 */
.task.fx-defeat::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  pointer-events: none;
  background: linear-gradient(105deg,
    transparent 22%,
    rgba(52, 211, 153, .38) 44%,
    rgba(167, 243, 208, .62) 52%,
    rgba(52, 211, 153, .38) 60%,
    transparent 80%);
  background-size: 260% 100%;
  animation: sweepGreen .62s var(--e-out) forwards;
  mix-blend-mode: screen;
}
@keyframes sweepGreen {
  0%   { background-position: 200% 0; opacity: 0; }
  22%  { opacity: 1; }
  100% { background-position: -70% 0; opacity: 0; }
}

/* 勾选动画 */
.task__check.fx-check {
  animation: checkPop .46s var(--e-spring) forwards;
}
@keyframes checkPop {
  0%   { transform: scale(1); }
  36%  { transform: scale(1.42); }
  62%  { transform: scale(.9); }
  100% { transform: scale(1); }
}
/* 勾选外圈冲击波 */
.task__check.fx-check::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 10px;
  border: 2px solid var(--success);
  animation: ringBurst .58s var(--e-out) forwards;
  pointer-events: none;
}
@keyframes ringBurst {
  0%   { transform: scale(.7); opacity: .85; }
  100% { transform: scale(2.3); opacity: 0; }
}

/* 任务归档淡出 */
.task.fx-vanish {
  animation: vanish .42s var(--e-out) forwards;
  pointer-events: none;
}
@keyframes vanish {
  0%   { opacity: 1; transform: scale(1); max-height: 200px; margin-bottom: 8px; }
  100% { opacity: 0; transform: scale(.86) translateX(18px); max-height: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; border-width: 0; }
}

/* 取消完成 */
.task.fx-revive { animation: revive .42s var(--e-spring); }
@keyframes revive {
  0%   { transform: scale(.94); }
  50%  { transform: scale(1.02); }
  100% { transform: scale(1); }
}

/* 新增任务落入 */
.task.fx-spawn { animation: spawn .5s var(--e-spring) both; }
@keyframes spawn {
  0%   { opacity: 0; transform: translateY(-14px) scale(.94); }
  60%  { opacity: 1; }
  100% { opacity: 1; transform: none; }
}

/* 迁移到今日 */
.task.fx-promote { animation: promote .58s var(--e-spring) both; }
@keyframes promote {
  0%   { opacity: 0; transform: translateX(-26px) scale(.9); box-shadow: 0 0 0 3px rgba(99,102,241,.24); }
  60%  { box-shadow: 0 0 0 5px rgba(99,102,241,.10); }
  100% { opacity: 1; transform: none; box-shadow: var(--sh-xs); }
}

/* ---------- XP 飘出 ---------- */
@keyframes xpRise {
  0%   { opacity: 0; transform: translate(-50%, 6px) scale(.5); }
  14%  { opacity: 1; transform: translate(-50%, -12px) scale(1.4); }
  30%  { transform: translate(-50%, -20px) scale(1.05); }
  46%  { transform: translate(-50%, -26px) scale(1.12); }
  100% { opacity: 0; transform: translate(-50%, -88px) scale(.9); }
}

/* ---------- XP 条增长脉冲 ---------- */
.qbar__fill.fx-gain, .lp__fill.fx-gain, .slv__fill.fx-gain {
  animation: barPulse .7s var(--e-out);
}
@keyframes barPulse {
  0%   { filter: brightness(1); }
  30%  { filter: brightness(1.5) saturate(1.3); }
  100% { filter: brightness(1); }
}

/* 数值跳动 */
.fx-bump { animation: bump .48s var(--e-spring); display: inline-block; }
@keyframes bump {
  0%   { transform: scale(1); }
  38%  { transform: scale(1.34); }
  100% { transform: scale(1); }
}

/* 成就解锁 */
.ach.fx-unlock { animation: unlockAch .8s var(--e-spring) both; }
@keyframes unlockAch {
  0%   { transform: scale(.86) rotate(-3deg); box-shadow: 0 0 0 0 rgba(245,158,11,.6); }
  40%  { transform: scale(1.06) rotate(1.5deg); box-shadow: 0 0 0 12px rgba(245,158,11,0); }
  100% { transform: none; }
}

/* 通关按钮呼吸 */
.fx-breathe { animation: breathe 2.4s var(--e-in-out) infinite; }
@keyframes breathe {
  0%, 100% { transform: scale(1); }
  50%      { transform: scale(1.035); }
}

/* 骰子/加载点 */
.dots { display: inline-flex; gap: 3px; align-items: center; }
.dots i {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
  display: block;
  animation: dotBounce 1.1s var(--e-in-out) infinite;
}
.dots i:nth-child(2) { animation-delay: .13s; }
.dots i:nth-child(3) { animation-delay: .26s; }
@keyframes dotBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: .45; }
  30%           { transform: translateY(-4px); opacity: 1; }
}

/* 摇晃（校验失败） */
.fx-shake { animation: shake .38s var(--e-in-out); }
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%      { transform: translateX(-6px); }
  40%      { transform: translateX(5px); }
  60%      { transform: translateX(-3px); }
  80%      { transform: translateX(2px); }
}

/* 环形高亮 */
.fx-highlight { animation: highlight 1.3s var(--e-out); }
@keyframes highlight {
  0%   { box-shadow: 0 0 0 0 rgba(99,102,241,.42); }
  100% { box-shadow: 0 0 0 16px rgba(99,102,241,0); }
}

/* === */
/* ============================================================
   ai.css — AI 助手（左侧侧拉抽屉）+ 设置弹层
   设计语言沿用底座：品牌紫、圆角、毛玻璃、柔和阴影
   ============================================================ */

/* 左侧抽屉：遮罩 + 抽屉本体（位于模态层 z-index:130 之下） */
.ai-drawer-scrim {
  position: fixed; inset: 0;
  background: rgba(15, 17, 30, .42);
  opacity: 0; pointer-events: none;
  transition: opacity .28s var(--e-out);
  z-index: 109;
}
.ai-drawer-scrim.is-open { opacity: 1; pointer-events: auto; }

.ai-drawer {
  position: fixed; top: 0; left: 0; bottom: 0;
  width: min(400px, 88vw);
  background: var(--surface);
  border-right: 1px solid var(--line);
  box-shadow: 10px 0 34px rgba(15, 17, 30, .22);
  transform: translateX(-100%);
  transition: transform .3s var(--e-out);
  z-index: 110;
  display: flex; flex-direction: column;
  will-change: transform;
}
.ai-drawer.is-open { transform: none; }
.ai-drawer__body { flex: 1; min-height: 0; display: flex; flex-direction: column; }

.aip { display: flex; flex-direction: column; height: 100%; min-height: 0; padding: 18px 16px 12px; }

/* 头部 */
.aip__head {
  display: flex; align-items: center; gap: 12px;
  padding: 6px 4px 14px;
}
.aip__orb {
  width: 42px; height: 42px; border-radius: var(--r-full);
  display: grid; place-items: center; flex: none;
  background: var(--grad-brand); color: #fff;
  box-shadow: 0 6px 18px rgba(99, 102, 241, .34);
}
.aip__orb svg { width: 22px; height: 22px; }
.aip__title { flex: 1; min-width: 0; }
.aip__title b { font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
.aip__title span { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.aip__gear {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-full);
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line); transition: var(--t-fast);
}
.aip__gear:hover { color: var(--brand); border-color: var(--brand); }
.aip__gear svg { width: 19px; height: 19px; }
.aip__close {
  width: 38px; height: 38px; flex: none; border-radius: var(--r-full);
  display: grid; place-items: center; cursor: pointer;
  background: var(--surface-2); color: var(--text-2);
  border: 1px solid var(--line); transition: var(--t-fast);
}
.aip__close:hover { color: var(--brand); border-color: var(--brand); }
.aip__close svg { width: 18px; height: 18px; }

/* 模式切换 tabs */
.aip__tabs {
  display: flex; gap: 4px; padding: 4px;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 14px; margin-bottom: 14px;
}
.aip__tab {
  flex: 1; border: 0; background: transparent; cursor: pointer;
  padding: 9px 6px; border-radius: 10px;
  font-size: 13px; font-weight: 600; color: var(--text-3);
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  transition: var(--t-fast);
}
.aip__tab svg { width: 18px; height: 18px; }
.aip__tab.is-active {
  background: var(--surface); color: var(--brand);
  box-shadow: 0 2px 8px rgba(99, 102, 241, .14);
}

/* 面板内容：填满抽屉剩余高度，内部各自滚动 */
.aip__panel { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: aipIn .28s var(--e-out); }
@keyframes aipIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* 离线提示条 */
.aip__offline {
  display: flex; gap: 10px; align-items: flex-start;
  background: color-mix(in srgb, var(--warn) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--warn) 35%, var(--line));
  color: var(--text-2); border-radius: 14px; padding: 12px 14px;
  font-size: 12.5px; line-height: 1.6; margin-bottom: 14px;
}
.aip__offline b { color: var(--warn-text, #B45309); }
.aip__offline svg { width: 18px; height: 18px; flex: none; margin-top: 1px; color: var(--warn); }

/* 通用问答：对话区 */
.aip__chat {
  display: flex; flex-direction: column; gap: 12px;
  flex: 1; min-height: 0; max-height: none; overflow-y: auto;
  padding: 4px 2px 10px;
}
.aip__empty {
  margin: auto; text-align: center; color: var(--text-4);
  font-size: 13px; line-height: 1.7; padding: 30px 10px;
}
.aip__empty svg { width: 40px; height: 40px; opacity: .5; margin-bottom: 8px; }
.aip__msg { max-width: 84%; padding: 10px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.62; white-space: pre-wrap; word-break: break-word; }
.aip__msg--bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; color: var(--text-1); }
.aip__msg--user { align-self: flex-end; background: var(--grad-brand); color: #fff; border-bottom-right-radius: 5px; }
.aip__msg--bot.is-err { border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); color: var(--danger); }
.aip__msg--typing span { display: inline-block; animation: aipDot 1s infinite; }
.aip__msg--typing span:nth-child(2) { animation-delay: .15s; }
.aip__msg--typing span:nth-child(3) { animation-delay: .3s; }
@keyframes aipDot { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }

/* 输入区 */
.aip__compose {
  display: flex; gap: 8px; align-items: flex-end;
  margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line);
}
.aip__compose textarea {
  flex: 1; resize: none; min-height: 44px; max-height: 120px;
  border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px;
  font: inherit; font-size: 14px; background: var(--surface); color: var(--text-1);
  transition: var(--t-fast);
}
.aip__compose textarea:focus { border-color: var(--brand); box-shadow: var(--sh-glow); outline: none; }
.aip__send {
  width: 44px; height: 44px; flex: none; border: 0; cursor: pointer; border-radius: 14px;
  background: var(--grad-brand); color: #fff; display: grid; place-items: center;
  box-shadow: 0 6px 16px rgba(99, 102, 241, .3); transition: var(--t-fast);
}
.aip__send:active { transform: scale(.92); }
.aip__send:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }
.aip__send svg { width: 20px; height: 20px; }

/* 闯关陪练 / 任务规划结果卡片（复用 .ai__* 风格，这里补充间距） */
.aip__panel .ai { box-shadow: none; border: 0; padding: 0; }
.aip__panel .ai__head { padding: 0 0 10px; }
.aip__panel .ai__body { padding: 0; }
.aip__run {
  width: 100%; margin-top: 4px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}

/* 设置弹层 */
.ai-set { text-align: left; }
.ai-set__hint {
  font-size: 12px; color: var(--text-3); line-height: 1.7;
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; margin-bottom: 14px;
}
.ai-field { margin-bottom: 13px; }
.ai-field > label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-2); margin-bottom: 6px; }
.ai-field input {
  width: 100%; border: 1px solid var(--line); border-radius: 12px;
  padding: 11px 13px; font: inherit; font-size: 14px;
  background: var(--surface); color: var(--text-1); transition: var(--t-fast);
}
.ai-field input:focus { border-color: var(--brand); box-shadow: var(--sh-glow); outline: none; }
.ai-keywrap { position: relative; }
.ai-keywrap input { padding-right: 52px; }
.ai-keywrap .ai-eye {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 38px; height: 32px; border: 0; background: transparent; cursor: pointer;
  color: var(--text-3); display: grid; place-items: center; border-radius: 8px;
}
.ai-keywrap .ai-eye:hover { color: var(--brand); }
.ai-keywrap .ai-eye svg { width: 17px; height: 17px; }
.ai-err { color: var(--danger); font-size: 12px; margin-top: 7px; min-height: 0; }
.ai-ok { color: var(--ok, #16A34A); font-size: 12px; margin-top: 7px; }
.ai-set__row { display: flex; gap: 8px; margin-top: 4px; }
.ai-set__row .btn { flex: 1; }
.ai-mask { font-size: 11.5px; color: var(--text-4); margin-top: 6px; word-break: break-all; }

@media (max-width: 760px) {
  .aip__tab { font-size: 12px; padding: 8px 4px; }
  .aip__tab svg { width: 16px; height: 16px; }
}

/* ============================================================
   store.js — 数据层：本地存储 / 任务模型 / 成长系统 / 成就
   全局命名空间：window.Q
   ============================================================ */
(function (global) {
  'use strict';

  var Q = global.Q || (global.Q = {});

  /* ---------------- 常量 ---------------- */
  var KEY = 'questly.v1';

  var XP = {
    urgent: 15,   // 紧急要办：击败精英怪
    today: 10,    // 今日挑战：标准 +10 XP
    inbox: 5,     // 灵感仓库：顺手完成
    clearBonus: 30,          // 今日通关奖励
    streakBonusPer: 5,       // 每连续一天额外奖励
    streakBonusMax: 50
  };

  var BUCKETS = {
    urgent: { id: 'urgent', name: '紧急要办', emoji: '🔥', desc: '必须马上处理的重要事项', tone: 'red' },
    today:  { id: 'today',  name: '今日挑战', emoji: '⚔️', desc: '今天要闯过的关卡',       tone: 'brand' },
    inbox:  { id: 'inbox',  name: '灵感仓库', emoji: '💡', desc: '想法、未来计划、暂不处理', tone: 'amber' }
  };

  var PRIORITIES = {
    p0: { id: 'p0', name: '紧急', color: '#EF4444', weight: 4 },
    p1: { id: 'p1', name: '高',   color: '#F97316', weight: 3 },
    p2: { id: 'p2', name: '中',   color: '#3B82F6', weight: 2 },
    p3: { id: 'p3', name: '低',   color: '#94A3B8', weight: 1 }
  };

  var TITLES = [
    '初来乍到', '见习行动派', '任务学徒', '效率新星', '节奏掌控者',
    '时间管理者', '高效执行官', '专注领主', '效率大师', '时间旅人', '传奇玩家'
  ];

  /* ---------------- 工具 ---------------- */
  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function dateKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }

  function shiftDay(key, delta) {
    var p = key.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    d.setDate(d.getDate() + delta);
    return dateKey(d);
  }

  function uid() {
    return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  /* ---------------- 等级 ---------------- */
  // 升到下一级所需 XP：80 + (level-1) * 60
  function needFor(level) { return 80 + (level - 1) * 60; }

  function levelInfo(totalXp) {
    var lv = 1, rest = Math.max(0, totalXp | 0), need = needFor(1);
    while (rest >= need && lv < 999) {
      rest -= need;
      lv++;
      need = needFor(lv);
    }
    return {
      level: lv,
      title: TITLES[Math.min(lv - 1, TITLES.length - 1)],
      inLevel: rest,
      need: need,
      pct: Math.min(100, Math.round((rest / need) * 100)),
      totalXp: totalXp | 0
    };
  }

  /* ---------------- 成就定义 ---------------- */
  var ACHIEVEMENTS = [
    { id:'first_blood', icon:'🎯', name:'首次出击',   desc:'完成第一个任务',            goal:1,   get:function(s){return s.stats.totalCompleted;} },
    { id:'early_bird',  icon:'🌅', name:'早起达人',   desc:'在早上 9 点前完成 3 个任务', goal:3,   get:function(s){return s.stats.earlyCount;} },
    { id:'night_owl',   icon:'🌙', name:'夜猫子',     desc:'在晚上 22 点后完成任务',     goal:1,   get:function(s){return s.stats.nightCount;} },
    { id:'ai_learner',  icon:'🤖', name:'AI学习者',   desc:'使用 AI 效率助手 3 次',      goal:3,   get:function(s){return s.stats.aiUses;} },
    { id:'executor',    icon:'⚡', name:'高效执行者', desc:'单日完成 5 个任务',          goal:5,   get:function(s){return s.stats.maxDaily;} },
    { id:'firefighter', icon:'🚒', name:'救火队长',   desc:'完成 10 个紧急任务',         goal:10,  get:function(s){return s.stats.urgentDone;} },

  /* ---------------- 事件总线 ---------------- */

      save();
      return state;

    try {
      var parsed = JSON.parse(raw);
      state = merge(defaults(), parsed);

      seed(state);

  function aiResultHTML(r) {
    var order = ['urgent', 'today', 'inbox'];

        '<div class="ai__grouphead">' + B.emoji + ' ' + esc(B.name) +

          var P = store.PRIORITIES[t.priority];

          return '<div class="ai__item" style="animation-delay:' + (i * 40) + 'ms">' +

  /* ============================================================
     任务中心
     ============================================================ */
  pages.tasks = function () {
    var all = store.state.tasks;
    var doneN = all.filter(function (t) { return t.done; }).length;

    function match(t) {
      if (taskFilter.status === 'todo' && t.done) return false;
      if (taskFilter.status === 'done' && !t.done) return false;
      if (taskFilter.priority !== 'all' && t.priority !== taskFilter.priority) return false;
      if (taskFilter.q) {
        var q = taskFilter.q.toLowerCase();
        if ((t.title + ' ' + (t.note || '')).toLowerCase().indexOf(q) < 0) return false;
      }
      return true;
    }

    var cols = ['urgent', 'today', 'inbox'].map(function (b) {
      var B = store.BUCKETS[b];
      var items = store.byBucket(b);
      var shown = items.filter(match);
      var doneC = items.filter(function (t) { return t.done; }).length;
      var mins = items.filter(function (t) { return !t.done; }).reduce(function (a, t) { return a + (t.estimate || 0); }, 0);
      var tone = b === 'urgent' ? 'red' : b === 'today' ? 'brand' : 'amber';

      var body = shown.length
        ? shown.map(function (t) { return ui.taskHTML(t, { promote: b === 'inbox' }); }).join('')
        : (items.length ? '<div class="empty"><div class="empty__emoji">🔍</div><b>没有匹配的任务</b><span>换个筛选条件试试</span></div>' : ui.emptyHTML(b));

      return '' +
      '<section class="card">' +
        '<div class="card__head">' +
          '<span class="sec-icon sec-icon--' + tone + '">' + B.emoji + '</span>' +
          '<div class="card__title">' +
            '<h3>' + esc(B.name) + '</h3>' +
            '<span class="countpill">' + doneC + '/' + items.length + '</span>' +
          '</div>' +
          '<div class="card__actions">' +
            '<button class="iconbtn" data-act="add" data-bucket="' + b + '" title="新增">' + I.plus + '</button>' +
          '</div>' +
        '</div>' +
        '<div style="padding:0 18px 10px;font-size:11.5px;color:var(--text-4)">' +
          esc(B.desc) + (mins ? ' · 待办约 ' + ui.fmtMin(mins) : '') +
        '</div>' +
        '<div class="card__body" style="padding-top:0">' +
          '<div class="tasklist stagger" data-dropzone="' + b + '">' + body + '</div>' +
          '<button class="quickadd" style="margin-top:8px" data-act="add" data-bucket="' + b + '">' + I.plus + '添加到' + esc(B.name) + '</button>' +
        '</div>' +
      '</section>';
    }).join('');

    var prios = [['all', '全部优先级']].concat(
      ['p0','p1','p2','p3'].map(function (p) { return [p, store.PRIORITIES[p].name]; })
    );

    return '' +
    '<div class="stack">' +
      '<div class="pagehead">' +
        '<div class="pagehead__t">' +
          '<h1>任务中心</h1>' +
          '<p>三个分区自由拖拽 · 共 ' + all.length + ' 条，已完成 ' + doneN + ' 条</p>' +
        '</div>' +
        '<div class="pagehead__a">' +
          (doneN ? '<button class="btn btn--outline" data-act="clear-done">' + I.trash + '清理已完成</button>' : '') +
          '<button class="btn btn--primary" data-act="add" data-bucket="today">' + I.plus + '新增任务</button>' +
        '</div>' +
      '</div>' +

      '<div class="filterbar">' +
        '<div class="searchbox">' + I.search +
          '<input id="task-search" placeholder="搜索任务…" value="' + esc(taskFilter.q) + '">' +
        '</div>' +
        '<div class="seg" data-seg="status" style="width:auto">' +
          [['all','全部'],['todo','待办'],['done','已完成']].map(function (o) {
            return '<button class="seg__btn' + (taskFilter.status === o[0] ? ' is-on' : '') + '" data-filter="status" data-val="' + o[0] + '" style="padding:0 12px">' + o[1] + '</button>';
          }).join('') +
        '</div>' +
        '<select class="select" id="prio-filter" style="width:auto;min-width:118px">' +
          prios.map(function (o) {
            return '<option value="' + o[0] + '"' + (taskFilter.priority === o[0] ? ' selected' : '') + '>' + o[1] + '</option>';
          }).join('') +
        '</select>' +
        '<span class="spacer"></span>' +
        '<span class="t-xs" style="display:flex;align-items:center;gap:5px">' + I.grip + '拖动卡片可跨区移动</span>' +
      '</div>' +

      '<div class="board">' + cols + '</div>' +
    '</div>';

  pages.growth = function () {

    var weekXp = days.reduce(function (a, d) { return a + d.xp; }, 0);

    var panel = '' +
    '<div class="levelpanel">' +
      ui.ringHTML(lv.pct, 112, 9, {
        cls: 'lp__ring', from: '#FBBF24', to: '#F472B6',
        center: '<b>' + lv.level + '</b><span>LEVEL</span>'
      }) +
      '<div class="lp__info">' +
        '<div class="lp__title">' +
          '<h2>' + esc(lv.title) + '</h2>' +
          '<span class="lp__badge">' + unlocked.length + '/' + achs.length + ' 成就</span>' +
        '</div>' +
        '<p class="lp__desc">再获得 <b style="color:#FBBF24">' + (lv.need - lv.inLevel) + ' XP</b> 即可升到 Lv.' + (lv.level + 1) + '</p>' +
        '<div class="lp__bar"><div class="lp__fill" style="width:' + lv.pct + '%"></div></div>' +

      '</div>' +

        '<div class="lp__stat"><b>' + s.profile.streak + '</b><span>连续天数</span></div>' +
        '<div class="lp__stat"><b>' + s.stats.totalCompleted + '</b><span>累计通关</span></div>' +
        '<div class="lp__stat"><b>' + s.stats.perfectDays + '</b><span>完美通关</span></div>' +
      '</div>' +
    '</div>';

    var chart = '' +
    '<section class="card">' +
      '<div class="card__head">' +
        '<span class="sec-icon sec-icon--cyan">' + I.chart + '</span>' +
        '<div class="card__title"><h3>最近 7 天</h3></div>' +
        '<span class="t-xs">本周 ' + weekDone + ' 个任务 · ' + weekXp + ' XP</span>' +
      '</div>' +
      '<div class="card__body">' +
        '<div class="chart">' +
          days.map(function (d, i) {
            var h = d.done ? Math.max(10, Math.round(d.done / maxDone * 100)) : 3;
            return '<div class="chart__col">' +
              '<div class="chart__barwrap">' +
                '<div class="chart__bar' + (d.done ? '' : ' is-zero') + (d.isToday ? ' is-today' : '') + '" ' +
                     'style="height:' + h + '%;animation-delay:' + (i * 60) + 'ms" title="' + d.key + '：完成 ' + d.done + ' 个">' +
                  (d.done ? '<span class="chart__val">' + d.done + '</span>' : '') +
                '</div>' +
              '</div>' +
              '<span class="chart__lab' + (d.isToday ? ' is-today' : '') + '">' + (d.isToday ? '今天' : d.label) + '</span>' +
            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</section>';

    var stats = '' +
    '<div class="grid-4">' +
      tile('⚡', '#EEF0FE', s.stats.totalXpEarned, '', '累计经验值') +
      tile('🚒', '#FDEDED', s.stats.urgentDone, '', '解决紧急事项') +
      tile('💡', '#FEF4E3', s.stats.inboxCreated, '', '记录灵感') +
      tile('📝', '#E6F5FE', s.stats.reviewCount, '', '完成复盘') +
    '</div>';

    var sorted = achs.slice().sort(function (a, b) {
      if (a.unlocked !== b.unlocked) return a.unlocked ? -1 : 1;
      return b.pct - a.pct;
    });

    var achGrid = '' +
    '<section class="card">' +
      '<div class="card__head">' +
        '<span class="sec-icon sec-icon--amber">' + I.trophy + '</span>' +
        '<div class="card__title"><h3>成就墙</h3><span class="countpill">' + unlocked.length + '/' + achs.length + '</span></div>' +
      '</div>' +
      '<div class="card__body">' +
        '<div class="grid-2 stagger">' +
          sorted.map(function (a) {
            return '<div class="ach' + (a.unlocked ? ' is-on' : '') + '" data-ach="' + a.id + '">' +
              '<div class="ach__ico">' + a.icon + '</div>' +
              '<div class="ach__main">' +
                '<b>' + esc(a.name) + '</b>' +

            '</div>';
          }).join('') +
        '</div>' +
      '</div>' +

    '<div class="stack">' +
      '<div class="pagehead">' +
        '<div class="pagehead__t">' +
          '<h1>我的成长</h1>' +
          '<p>每完成一个任务，都在把自己往前推一点</p>' +
        '</div>' +
      '</div>' +
      panel + stats + chart + achGrid + examGrowthCard() +
    '</div>';

        }) +
        '<div style="flex:1;min-width:200px">' +

挑战", "idx": 155}, {"no": 35, "section": "judge", "type": "judge", "q": "安全帽是避免或减轻从高处坠落物体或侧向飞来物体对头部造成危害的个体防护用具。作业时只要高处或侧 向无大的飞来物体，则无需佩戴安全帽。", "options": [], "answer": ["F"], "explain": "", "cat": 7, "catName": "高处作业与有限空间", "idx": 156}, {"no": 36, "section": "judge", "type": "judge", "q": "安全色和安全标志是一个国家规定的传递安全信息的标准。安全色包括红、蓝、黄、绿四种颜色。其中蓝色 表示注意、警告的意思。", "options": [], "answer": ["F"], "explain": "黄色", "cat": 1, "catName": "安全生产法律法规", "idx": 157}, {"no": 37, "section": "judge", "type": "judge", "q": "安全生产标准化要求企业应根据生产特点，编制岗位安全操作规程，并发放到相关岗位。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 158}, {"no": 38, "section": "judge", "type": "judge", "q": "安全生产标准是围绕如何消除、限制或预防劳动过程中的危险和有害因素，保护职工安全与健康，保障设备、 生产正常运行而制定的统一规定。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 159}, {"no": 39, "section": "judge", "type": "judge", "q": "安全生产的基本方针是： 安全第一，预防为主、全民参与。", "options": [], "answer": ["F"], "explain": "综合治理", "cat": 11, "catName": "综合判断题挑战", "idx": 160}, {"no": 40, "section": "judge", "type": "judge", "q": "安全生产工作实行管行业必须管安全、管业务必须管安全、管生产经营必须管安全。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 161}, {"no": 41, "section": "judge", "type": "judge", "q": "安全生产工作应当以人为本，坚持人民至上、生命至上，把保护人民生命安全摆在首位，树牢安全发展理念， 坚持安全第一，预防为主、综合治理的方针，从源头上防范化解重大安全风险。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 162}, {"no": 42, "section": "judge", "type": "judge", "q": "安全生产工作重点是防止领导的不安全行为。", "options": [], "answer": ["F"], "explain": "防止人的不安全行为", "cat": 11, "catName": "综合判断题挑战", "idx": 163}, {"no": 43, "section": "judge", "type": "judge", "q": "安全生产管理的目的是保障劳动者的安全和健康，不属于企业管理的范畴。", "options": [], "answer": ["F"], "explain": "属于企业的管理范畴", "cat": 2, "catName": "安全生产责任与管理", "idx": 164}, {"no": 44, "section": "judge", "type": "judge", "q": "安全生产检查的工作程序是：安全检查准备；实施安全检查。", "options": [], "answer": ["F"], "explain": "安全检查准备；实施安全检查，综合分析等", "cat": 11, "catName": "综合判断题挑战", "idx": 165}, {"no": 45, "section": "judge", "type": "judge", "q": "安全生产检查的内容包括查思想、查领导、查制度、查措施、查安全生产补贴发放、查事故处理、查组织、 查教育培训。", "options": [], "answer": ["F"], "explain": "查隐患", "cat": 2, "catName": "安全生产责任与管理", "idx": 166}, {"no": 46, "section": "judge", "type": "judge", "q": "安全生产检查的内容包括查思想、查领导、查制度、查措施、查效益、查事故处理、查组织、查教育培训", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 167}, {"no": 47, "section": "judge", "type": "judge", "q": "安全生产检查是安全管理工作的重要内容，是消除隐患、防止事故发生、改善劳动条件的重要手段。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 168}, {"no": 48, "section": "judge", "type": "judge", "q": "安全生产责任制的实质是“安全生产，领导有责”。", "options": [], "answer": ["F"], "explain": "人人有责", "cat": 2, "catName": "安全生产责任与管理", "idx": 169}, {"no": 49, "section": "judge", "type": "judge", "q": "安全生产责任制是企业安全生产管理制度的核心。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 170}, {"no": 50, "section": "judge", "type": "judge", "q": "安全生产责任制是一项最基本的安全生产制度，是其他各项安全规章制度得以切实实施的基本保证。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 171}, {"no": 51, "section": "judge", "type": "judge", "q": "安全资金投入是保障安全生产的重要条件，进行必要的安全生产资金投入，但不是生产经营单位的法定义务", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 172}, {"no": 52, "section": "judge", "type": "judge", "q": "被称为高处作业“三宝”是安全警示标志、安全带（绳） 、安全网。", "options": [], "answer": ["F"], "explain": "安全帽、安全带、安全网", "cat": 7, "catName": "高处作业与有限空间", "idx": 173}, {"no": 53, "section": "judge", "type": "judge", "q": "被称为高处作业“三宝”是工伤保险、安全带（绳） 、安全网。", "options": [], "answer": ["F"], "explain": "安全帽、安全带、安全网", "cat": 1, "catName": "安全生产法律法规", "idx": 174}, {"no": 54, "section": "judge", "type": "judge", "q": "编制应急救援预案的目的是确保不发生事故。", "options": [], "answer": ["F"], "explain": "迅速、有效地减少事故所带来的损失", "cat": 10, "catName": "应急救援与事故处理", "idx": 175}, {"no": 55, "section": "judge", "type": "judge", "q": "操作规程要涵盖从进入操作现场、操作准备到操作结束和离开操作现场部分操作环节。", "options": [], "answer": ["F"], "explain": "操作过程", "cat": 11, "catName": "综合判断题挑战", "idx": 176}, {"no": 56, "section": "judge", "type": "judge", "q": "操作人员操作机器时，机器超速运转属于物的不安全状态。", "options": [], "answer": ["F"], "explain": "人操作的，人的不安全行为", "cat": 11, "catName": "综合判断题挑战", "idx": 177}, {"no": 57, "section": "judge", "type": "judge", "q": "厂长安排新工人进行金属焊接作业，必须由有经验的老工人教授焊接技能 30 天以上，待新工人学会后，方 可独立进行焊接作业。", "options": [], "answer": ["F"], "explain": "持证上岗", "cat": 6, "catName": "机械与作业现场安全", "idx": 178}, {"no": 58, "section": "judge", "type": "judge", "q": "车间的电气设备发生故障， 应立即请安全生产管理人员来检修。", "options": [], "answer": ["F"], "explain": "专业人员维修", "cat": 2, "catName": "安全生产责任与管理", "idx": 179}, {"no": 59, "section": "judge", "type": "judge", "q": "尘肺是生产性粉尘所引起的最常见的职业病。", "options": [], "answer": ["T"], "explain": "", "cat": 8, "catName": "职业病与劳动防护", "idx": 180}, {"no": 60, "section": "judge", "type": "judge", "q": "触电者停止呼吸又无心脏跳动时，应在同一时间内进行人工呼吸和心脏按压，两种抢救方法同步进行。", "options": [], "answer": ["F"], "explain": "单人徒手心肺复苏，交替进行", "cat": 5, "catName": "电气与触电安全", "idx": 181}, {"no": 61, "section": "judge", "type": "judge", "q": "从事两种特种作业的人员，只要参加其中一种的特种作业培训与考核，即可上岗操作两种特种作业。", "options": [], "answer": ["F"], "explain": "持证上岗，两种特种作业上岗证", "cat": 2, "catName": "安全生产责任与管理", "idx": 182}, {"no": 62, "section": "judge", "type": "judge", "q": "从业人员应当履行的义务是：遵守安全生产规章制度和操作规程的义务、服从管理的义务、正确佩戴和使用 劳动防护用品的义务、发现事故隐患及时报告的义务和接受安全生产培训教育的义务。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 183}, {"no": 63, "section": "judge", "type": "judge", "q": "从业人员在作业过程中，应当严格遵守本单位的安全生产规章制度和操作规程，服从管理，正确佩戴和使用 劳动防护用品。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 184}, {"no": 64, "section": "judge", "type": "judge", "q": "单位发生火灾时，应当立即实施灭火和应急疏散预案，务必做到及时报警，迅速扑救火灾，及时疏散人员。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 185}, {"no": 65, "section": "judge", "type": "judge", "q": "单位负责人接到事故报告后，应当迅速采取有效措施，组织抢救，防止事故扩大，减少人员伤亡和财产损失， 并按照国家有关规定立即如实报告当地负有安全生产监督管理职责的部门，不得隐瞒不报、谎报或者迟报，不得故 意破坏事故现场、毁灭有关证据。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 186}, {"no": 66, "section": "judge", "type": "judge", "q": "单位负责人接到事故报告后，应当迅速采取有效措施，组织抢救 ，防止事故扩大，减少人员伤亡和财产损失， 并按照国家有关规定立即如实报告当地负有公安或卫生监督管理职责的部门，不得隐瞒不报、谎报或者迟报，不得 故意破坏事故现场、毁灭有关证据。", "options": [], "answer": ["F"], "explain": "安全生产监督管理", "cat": 2, "catName": "安全生产责任与管理", "idx": 187}, {"no": 67, "section": "judge", "type": "judge", "q": "单位负责人接到事故报告后，应当迅速采取有效措施，组织抢救 ，防止事故扩大，减少人员伤亡和财产损失， 并按照国家有关规定立即如实报告当地负有公安或卫生监督管理职责的部门，不得隐瞒不报、谎报或者迟报，不得 故意破坏事故现场、毁灭有关证据。", "options": [], "answer": ["F"], "explain": "安全生产监督管理", "cat": 2, "catName": "安全生产责任与管理", "idx": 188}, {"no": 68, "section": "judge", "type": "judge", "q": "单位应当将容易发生火灾、一旦发生火灾可能严重危及人身和财产安全以及对消防安全有重大影响的部位确定 为消防安全重点部位，设置明显的防火标志，实行严格管理。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 189}, {"no": 69, "section": "judge", "type": "judge", "q": "单重绝缘是指工作绝缘（基本绝缘）和保护绝缘（ 附加绝缘） 。", "options": [], "answer": ["F"], "explain": "双重绝缘", "cat": 5, "catName": "电气与触电安全", "idx": 190}, {"no": 70, "section": "judge", "type": "judge", "q": "当单位的安全出口上锁、遮挡，或者占用、堆放物品影响疏散通道畅通时，单位应当责令有关人员当场改正并 督促落实。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 191}, {"no": 71, "section": "judge", "type": "judge", "q": "当地政府部门必须为从业人员提供符合国家标准或者行业标准的劳动防护用品，并监督、教育从业人员按照使 用规则佩戴、使用。", "options": [], "answer": ["F"], "explain": "用人单位", "cat": 1, "catName": "安全生产法律法规", "idx": 192}, {"no": 72, "section": "judge", "type": "judge", "q": "当生产与安全发生矛盾时，必须坚持“生产服从安全”的原则，优先解决安全问题，确保安全才进行生产。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 193}, {"no": 73, "section": "judge", "type": "judge", "q": "电焊工尘肺病是长期大量吸入电焊烟尘所致的尘肺。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 194}, {"no": 74, "section": "judge", "type": "judge", "q": "电器设备和灯具如高温部位靠近装饰材料（不燃材料除外） ，应采取隔热、散热等防火保护措施。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 195}, {"no": 75, "section": "judge", "type": "judge", "q": "调查事故的主要目的是追究责任。", "options": [], "answer": ["F"], "explain": "查清楚事故所发生的原因", "cat": 10, "catName": "应急救援与事故处理", "idx": 196}, {"no": 76, "section": "judge", "type": "judge", "q": "洞口作业是指：孔、洞口旁边的高处作业，包括施工现场及通道旁深度在 3m 及 3m 以上的桩孔、沟槽与 管道孔洞等边沿作业。", "options": [], "answer": ["F"], "explain": "2m及2m以上", "cat": 7, "catName": "高处作业与有限空间", "idx": 197}, {"no": 77, "section": "judge", "type": "judge", "q": "对动火、进入受限空间、破土、 临时用电等作业时实施登记统计管理。", "options": [], "answer": ["F"], "explain": "审批、监护、有相应许可证", "cat": 2, "catName": "安全生产责任与管理", "idx": 198}, {"no": 78, "section": "judge", "type": "judge", "q": "发现起火立即报警，第一先保护财产，后救人的原则，先控制后消灭、合理选用灭火溶剂和灭火方法。", "options": [], "answer": ["F"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 199}, {"no": 79, "section": "judge", "type": "judge", "q": "发现起火立即报警，救人第一，先控制后消灭、先重点后一般的原则，合理选用灭火溶剂和灭火方法。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 200}, {"no": 80, "section": "judge", "type": "judge", "q": "发现重大安全隐患，要立即停止作业并向项目部有关人员报告，必要时有权越级上报。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 201}, {"no": 81, "section": "judge", "type": "judge", "q": "防止产生燃烧的基本技术措施是：消除助燃物是防火措施中最基本的措施。", "options": [], "answer": ["F"], "explain": "可燃物", "cat": 4, "catName": "消防安全", "idx": 202}, {"no": 82, "section": "judge", "type": "judge", "q": "粉尘的分散度是表示粉尘颗粒大小的一个概念，直径小于 10 微米的粉尘对机体危害较大，也易于达到呼吸 器官深部。", "options": [], "answer": ["F"], "explain": "直径小于 5 微米", "cat": 8, "catName": "职业病与劳动防护", "idx": 203}, {"no": 83, "section": "judge", "type": "judge", "q": "高处作业“五个必须”是指（ 1）必须岗前培训上岗。（ 2）必须实行作业审批。（ 3）必须做好个人防护。 （ 4）必须落实工程措施。（ 5）必须安排专人监护。", "options": [], "answer": ["F"], "explain": "必须持证上岗", "cat": 2, "catName": "安全生产责任与管理", "idx": 204}, {"no": 84, "section": "judge", "type": "judge", "q": "高处作业“五个必须”是指：①必须领导带班。②必须实行作业审批。③必须做好个人防护。④必须落实工 程措施。⑤必须安排专人监护。", "options": [], "answer": ["F"], "explain": "必须持证上岗", "cat": 7, "catName": "高处作业与有限空间", "idx": 205}, {"no": 85, "section": "judge", "type": "judge", "q": "高处作业实施作业票制度，作业前必须进行审批，经批准后方可进行作业。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 206}, {"no": 86, "section": "judge", "type": "judge", "q": "高分散度的粉尘具有爆炸性，发生爆炸的条件是高温和粉尘在空气中达到足够的浓度。", "options": [], "answer": ["T"], "explain": "", "cat": 8, "catName": "职业病与劳动防护", "idx": 207}, {"no": 87, "section": "judge", "type": "judge", "q": "个人防护是把人体与意外释放能量或危险物质隔开，是一种不得已的隔离措施，但却是保护人身安全的最后 一道防线。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 208}, {"no": 88, "section": "judge", "type": "judge", "q": "各工种工人遇有严重人身危险而无保证安全措施的作业，有权拒绝施工。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 209}, {"no": 89, "section": "judge", "type": "judge", "q": "根据《劳动法》的规定 ，除文艺、体育和特种行业外，禁止用人单位招用未满 16 周岁的未成年人。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 210}, {"no": 90, "section": "judge", "type": "judge", "q": "根据国家安全色规定，安全色为红、蓝、黄、绿四种颜色。其中黄色引人注目，主要用于指令必须遵守的规 定标志。", "options": [], "answer": ["F"], "explain": "蓝色", "cat": 11, "catName": "综合判断题挑战", "idx": 211}, {"no": 91, "section": "judge", "type": "judge", "q": "鼓励组织外单位专业技术人员或聘请、委托专业技术服务机构对本单位“一线三排”工作进行指导，保证隐 患排查全面性、排序科学性、排除有效性。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 212}, {"no": 92, "section": "judge", "type": "judge", "q": "国务院第 493 号令《生产安全事故报告和调查处理条例》明确规定：事故发生后，单位负责人应当于 24 小 时内向事故发生地县级以上人民政府安全生产监督管理部门和负有安全生产监督管理职责的有关部门报告。", "options": [], "answer": ["F"], "explain": "1个小时", "cat": 1, "catName": "安全生产法律法规", "idx": 213}, {"no": 93, "section": "judge", "type": "judge", "q": "国务院第 493 号令明确事故处理“ 四不放过”原则是：事故原因未查明、责任人未处理、整改措施未落实、 处罚金没上缴不放过。", "options": [], "answer": ["F"], "explain": "有关人员未受教育不放过", "cat": 10, "catName": "应急救援与事故处理", "idx": 214}, {"no": 94, "section": "judge", "type": "judge", "q": "国务院第 493 号令明确事故处理“ 四不放过”原则是：事故原因未查明、责任人未处理、整改措施未落实、 相关领导未受教育不放过。", "options": [], "answer": ["F"], "explain": "有关人员未受教育不放过", "cat": 10, "catName": "应急救援与事故处理", "idx": 215}, {"no": 95, "section": "judge", "type": "judge", "q": "机械伤害的原因：机械的不安全状态；作业场所的不安全状态；操作者的不安全行为。", "options": [], "answer": ["T"], "explain": "", "cat": 6, "catName": "机械与作业现场安全", "idx": 216}, {"no": 96, "section": "judge", "type": "judge", "q": "机械设备上的局部照明灯可以使用 110V 或者 220V 的电压。", "options": [], "answer": ["F"], "explain": "不超过36v/安全电压", "cat": 6, "catName": "机械与作业现场安全", "idx": 217}, {"no": 97, "section": "judge", "type": "judge", "q": "建立安全管理档案是为了规范日常安全管理工作，提高安全生产事故防控能力。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 218}, {"no": 98, "section": "judge", "type": "judge", "q": "交叉作业动火令“三个一律”是指一律不准进行交叉作业，一律清除现场可燃物质，一律检测可燃气体含量、 保持良好通风，严防交叉作业动火引发爆炸、火灾事故。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 219}, {"no": 99, "section": "judge", "type": "judge", "q": "绝缘是用绝缘物把带电体封闭起来。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 220}, {"no": 100, "section": "judge", "type": "judge", "q": "劳动防护用品是保护劳动者的安全和健康的一项重要措施，也是保证安全生产的最后一道防线。因此，每位 从业人员必须正确佩戴劳动防护用品。", "options": [], "answer": ["T"], "explain": "", "cat": 8, "catName": "职业病与劳动防护", "idx": 221}, {"no": 101, "section": "judge", "type": "judge", "q": "劳动防护用品是劳动者在日常生活过程中为免遭或减轻事故伤害和职业危害的个人随身穿戴的用品，简称防 护用品。", "options": [], "answer": ["F"], "explain": "", "cat": 8, "catName": "职业病与劳动防护", "idx": 222}, {"no": 102, "section": "judge", "type": "judge", "q": "临时线路上的电气装置因使用时间短，可不装设漏电保护器。", "options": [], "answer": ["F"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 223}, {"no": 103, "section": "judge", "type": "judge", "q": "漏电保护器其中主要是用于防止由漏电引起的触电事故。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 224}, {"no": 104, "section": "judge", "type": "judge", "q": "漏电保护器主要是用于防止由漏电引起的触电事故。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 225}, {"no": 105, "section": "judge", "type": "judge", "q": "漏电保护装置主要用于防止间接接触电击和直接接触电击。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 226}, {"no": 106, "section": "judge", "type": "judge", "q": "灭火的基本技术措施有 ：隔离、窒息、冷却、化学抑制。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 227}, {"no": 107, "section": "judge", "type": "judge", "q": "灭火器压力表用红、黄、绿三色表示压力情况，当指针指在绿色区域表示压力正常。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 228}, {"no": 108, "section": "judge", "type": "judge", "q": "某企业为了提高员工工资待遇，决定以现金替代劳动防护用品， 由员工自愿购买劳动防护用品。", "options": [], "answer": ["F"], "explain": "", "cat": 8, "catName": "职业病与劳动防护", "idx": 229}, {"no": 109, "section": "judge", "type": "judge", "q": "屏护是采用遮栏、护罩、护盖、箱闸等将带电体同外界隔绝开来。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 230}, {"no": 110, "section": "judge", "type": "judge", "q": "企业不必把轻伤事故包括在严格管理范围之内。", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 231}, {"no": 111, "section": "judge", "type": "judge", "q": "企业复工复产，安全生产管理机构应及时复查整改落实情况、签名确认，建立档案、形成闭环。整改工作要 落实责任 ，明确责任部门和责任人、整改措施和期限。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 232}, {"no": 112, "section": "judge", "type": "judge", "q": "企业管理是企业生存、发展的灵魂，而企业的职业安全健康管理是企业管理的重要组成部分。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 233}, {"no": 113, "section": "judge", "type": "judge", "q": "企业人员安全教育培训制度是企业安全生产管理制度的核心。", "options": [], "answer": ["F"], "explain": "安全生产责任制度", "cat": 2, "catName": "安全生产责任与管理", "idx": 234}, {"no": 114, "section": "judge", "type": "judge", "q": "企业人员如果未与企业签订劳动合同书，就不能确定其可以享受工伤保险待遇。", "options": [], "answer": ["F"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 235}, {"no": 115, "section": "judge", "type": "judge", "q": "企业是安全生产的责任主体，主要负责人是第一责任人，必须严格履行安全生产法定责任，对安全生产工作 进行全员、全方位、全过程的综合管理，做到安全责任、管理、投入、培训和应急救援“五到位”。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 236}, {"no": 116, "section": "judge", "type": "judge", "q": "企业通过落实企业安全生产主体责任，通过全员全过程参与，建立并保持安全生产管理体系，全面管控生产 经营活动各环节的安全生产与职业卫生工作，实现安全健康管理系统化、岗位操作行为规范化、设备设施本质安全 化、作业环境器具定置化，并持续改进。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 237}, {"no": 117, "section": "judge", "type": "judge", "q": "企业在生产、经营、储存、使用危险物品的车间、商店、仓库等建筑内，可设置员工宿舍，员工宿舍与危险 场所应保持安全距离。", "options": [], "answer": ["F"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 238}, {"no": 118, "section": "judge", "type": "judge", "q": "燃烧必然伴随着光和热的产生。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 239}, {"no": 119, "section": "judge", "type": "judge", "q": "燃烧必须具备可燃物、氧化剂、点火源三个基本条件才有可能发生。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 240}, {"no": 120, "section": "judge", "type": "judge", "q": "人的不安全行为是指操作者在操作过程中的不符合规定或安全地导致伤害后果的行为。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 241}, {"no": 121, "section": "judge", "type": "judge", "q": "人工呼吸适用于触电休克，溺水。有害气体中毒，窒息或外伤窒息等引起的呼吸停止、假死状态者，如果呼 吸停止不久人都能通过人工呼吸抢救过来。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 242}, {"no": 122, "section": "judge", "type": "judge", "q": "人体发生触电后，根据电流通过人体的途径和人体触及带电体方式，一般可分为单相触电、两相触电及三相 触电。", "options": [], "answer": ["F"], "explain": "跨步电压触电", "cat": 5, "catName": "电气与触电安全", "idx": 243}, {"no": 123, "section": "judge", "type": "judge", "q": "任何电气设备在未验明无电之前，一律认为有电。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 244}, {"no": 124, "section": "judge", "type": "judge", "q": "日常的安全检查是以安全生产管理人员为主体的检查形式。", "options": [], "answer": ["F"], "explain": "员工", "cat": 2, "catName": "安全生产责任与管理", "idx": 245}, {"no": 125, "section": "judge", "type": "judge", "q": "日常的安全检查是以基层负责人为主体的检查形式。", "options": [], "answer": ["F"], "explain": "员工", "cat": 11, "catName": "综合判断题挑战", "idx": 246}, {"no": 126, "section": "judge", "type": "judge", "q": "日常的安全检查是以生产经营单位主要负责人为主体的检查形式。", "options": [], "answer": ["F"], "explain": "员工", "cat": 2, "catName": "安全生产责任与管理", "idx": 247}, {"no": 127, "section": "judge", "type": "judge", "q": "设备安全运行操作规程规定操作过程该干什么，不该干什么，或设备应该处于什么样的状态，是操作人员正 确操作设备的依据，是保证设备安全运行的规范。", "options": [], "answer": ["T"], "explain": "", "cat": 6, "catName": "机械与作业现场安全", "idx": 248}, {"no": 128, "section": "judge", "type": "judge", "q": "生产、经营、储存、使用危险物品的车间、仓库可以与员工宿舍在同一座建筑物内，并应与员工宿舍保持一 定安全距离。", "options": [], "answer": ["F"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 249}, {"no": 129, "section": "judge", "type": "judge", "q": "生产安全报告事故应当包括的内容有事故发生单位概况、事故的简要经过、初步估计的直接经济损失、伤亡 人数等。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 250}, {"no": 130, "section": "judge", "type": "judge", "q": "生产安全事故不一定可防可控，但预防是对生产中存在和可能产生的危险因素进行识别、评价并采取有效的 防控措施。", "options": [], "answer": ["F"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 251}, {"no": 131, "section": "judge", "type": "judge", "q": "生产场所的危险源数量越大，发生事故的概率几率就越大。", "options": [], "answer": ["F"], "explain": "按照不同等级划分", "cat": 10, "catName": "应急救援与事故处理", "idx": 252}, {"no": 132, "section": "judge", "type": "judge", "q": "生产过程中的有害因素有：化学因素、物理因素、环境因素。", "options": [], "answer": ["F"], "explain": "生物因素", "cat": 11, "catName": "综合判断题挑战", "idx": 253}, {"no": 133, "section": "judge", "type": "judge", "q": "生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口、疏散通道。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 254}, {"no": 134, "section": "judge", "type": "judge", "q": "生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口、疏散通道。禁止占用、 锁闭、封堵生产经营场所或者员工宿舍的出口、疏散通道。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 255}, {"no": 135, "section": "judge", "type": "judge", "q": "生产经营场所和员工宿舍应当设有符合紧急疏散要求、标志明显、保持畅通的出口。禁止锁闭、封堵生产经 营场所或者员工宿舍的出口。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 256}, {"no": 136, "section": "judge", "type": "judge", "q": "生产经营场所和员工宿舍应当设有符合生产经营单位员工要求、标志明显、保持畅通的出口、疏散通道。禁 止占用、锁闭、封堵生产经营场所或者员工宿舍的出口、疏散通道。", "options": [], "answer": ["F"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 257}, {"no": 137, "section": "judge", "type": "judge", "q": "生产经营单位的安全生产管理人员应当根据本单位的生产经营特点，对安全生产状况进行经常性检查。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 258}, {"no": 138, "section": "judge", "type": "judge", "q": "生产经营单位的安全生产规章制度是生产经营单位安全生产管理的标准和行为规范，是国家安全生产法律法 规在企业的延伸和生产经营实践的具体化。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 259}, {"no": 139, "section": "judge", "type": "judge", "q": "生产经营单位的从业人员是指该单位从事生产经营活动各项工作的所有人员，包括管理人员、技术人员和各 岗位的工人，但不包括临时聘用的人员。", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 260}, {"no": 140, "section": "judge", "type": "judge", "q": "生产经营单位的主要负责人、分管负责人、安全生产管理人员和一线工人应当对隐患的治理进行定期督办。", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 261}, {"no": 141, "section": "judge", "type": "judge", "q": "生产经营单位的主要负责人包括生产经营单位参与经营管理的法定代表人、投资人和实际负有本单位生产经 营最高管理权限的人员。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 262}, {"no": 142, "section": "judge", "type": "judge", "q": "生产经营单位的主要负责人未履行本法规定的安全生产管理职责的，责令限期改正，处二万元以上五万元以 下的罚款；逾期未改正的，处五万元以上十万元以下的罚款，责令生产经营单位停产停业整顿。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 263}, {"no": 143, "section": "judge", "type": "judge", "q": "生产经营单位对重大危险源应当登记建档，进行定期检测、评估、 监控，并制定应急预案。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 264}, {"no": 144, "section": "judge", "type": "judge", "q": "生产经营单位对重大危险源应当登记建档，进行定期检测、评估、监控，并制定应急预案，告知从业人员和 相关人员在紧急情况下应当采取的应急措施。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 265}, {"no": 145, "section": "judge", "type": "judge", "q": "生产经营单位发生生产安全事故时，单位的保安人员应当立即组织抢救，并不得在事故调查处理期间擅离职 守。", "options": [], "answer": ["F"], "explain": "主要负责人", "cat": 10, "catName": "应急救援与事故处理", "idx": 266}, {"no": 146, "section": "judge", "type": "judge", "q": "生产经营单位将生产经营项目、场所、设备发包或者出租，是一种民事行为，一切安全生产责任由承租人、 承包方负责。", "options": [], "answer": ["F"], "explain": "双方都需要负责", "cat": 6, "catName": "机械与作业现场安全", "idx": 267}, {"no": 147, "section": "judge", "type": "judge", "q": "生产经营单位可以以书面形式与从业人员订立协议，免除或者减轻其对从业人员因生产安全事故伤亡依法应 承担的责任。", "options": [], "answer": ["F"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 268}, {"no": 148, "section": "judge", "type": "judge", "q": "生产经营单位里发生的生产安全事故的原因是多方面的，但主要是“物的因素”。", "options": [], "answer": ["F"], "explain": "人的因素", "cat": 10, "catName": "应急救援与事故处理", "idx": 269}, {"no": 149, "section": "judge", "type": "judge", "q": "生产经营单位通过采取措施，给所有生产设备都安装了良好的安全防护设施，实现了本质安全，这就可以避 免一切事故。", "options": [], "answer": ["F"], "explain": "", "cat": 6, "catName": "机械与作业现场安全", "idx": 270}, {"no": 150, "section": "judge", "type": "judge", "q": "生产经营单位未按照规定对一线工人、被派遣劳动者、实习学生进行安全生产教育和培训，或者未按照规定 如实告知有关的安全生产事项的，责令限期改正，处十万元以下的罚款；逾期未改正的，责令停产停业整顿，并处 十万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处二万元以上五万元以下的罚款", "options": [], "answer": ["F"], "explain": "从业人员", "cat": 2, "catName": "安全生产责任与管理", "idx": 271}, {"no": 151, "section": "judge", "type": "judge", "q": "生产经营单位未建立安全风险分级管控制度或者未按照安全风险分级采取相应管控措施的，责令限期改正， 处十万元以下的罚款；逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下的罚款，对其直接负责的 主管人员和其他直接责任人员处二万元以上五万元以下的罚款；构成犯罪的，依照刑法有关规定追究刑事责任。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 272}, {"no": 152, "section": "judge", "type": "judge", "q": "生产经营单位未将故障排查治理情况如实记录或者未向从业人员通报的，责令限期改正，处十万元以下的罚 款；逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直 接责任人员处二万元以上五万元以下的罚款。", "options": [], "answer": ["F"], "explain": "隐患", "cat": 3, "catName": "隐患排查与一线三排", "idx": 273}, {"no": 153, "section": "judge", "type": "judge", "q": "生产经营单位未将事故隐患排查治理情况如实记录或者未向从业人员通报的，责令限期改正，处十万元以下 的罚款；逾期未改正的，责令停产停业整顿，并处十万元以上二十万元以下的罚款，对其直接负责的主管人员和其 他直接责任人员处二万元以上五万元以下的罚款。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 274}, {"no": 154, "section": "judge", "type": "judge", "q": "生产经营单位未如实记录安全生产教育和培训情况的，责令限期改正，处十万元以下的罚款；逾期未改正的， 责令停产停业整顿，并处十万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处二万元 以上五万元以下的罚款。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 275}, {"no": 155, "section": "judge", "type": "judge", "q": "生产经营单位未为从业人员提供符合国家标准或者行业标准的劳动防护用品的，责令限期改正，处五万元以 下的罚款；逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一 万元以上二万元以下的罚款；情节严重的，责令停产停业整顿；构成犯罪的，依照刑法有关规定追究刑事责任。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 276}, {"no": 156, "section": "judge", "type": "judge", "q": "生产经营单位未为从业人员提供符合国家标准或者行业标准所有物品的，责令限期改正，处五万元以下的罚 款；逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其他直接责任人员处一万元以 上二万元以下的罚款；情节严重的，责令停产停业整顿；构成犯罪的，依照刑法有关规定追究刑事责任。", "options": [], "answer": ["F"], "explain": "劳动防护用品", "cat": 1, "catName": "安全生产法律法规", "idx": 277}, {"no": 157, "section": "judge", "type": "judge", "q": "生产经营单位未依法设置安全生产管理机构或者配备安全生产管理人员、进行安全生产考核和培训、为从业 人员提供劳动防护用品的，由具体实施安全生产监督管理的部门责令限期改正；逾期未改正的，责令停产停业，并 可以依法处以罚款。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 278}, {"no": 158, "section": "judge", "type": "judge", "q": "生产经营单位未在有较大危险因素的生产经营场所和有关设施、设备上设置明显的安全警示标志的，责令限 期改正，处五万元以下的罚款；逾期未改正的，处五万元以上二十万元以下的罚款，对其直接负责的主管人员和其 他直接责任人员处一万元以上二万元以下的罚款；情节严重的，责令停产停业整顿；构成犯罪的，依照刑法有关规 定追究刑事责任。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 279}, {"no": 159, "section": "judge", "type": "judge", "q": "生产经营单位依法建立“一线三排”责任制，将检查及处理情况应当如实记录在案，不须向本单位从业人员 通报有关情况。", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 280}, {"no": 160, "section": "judge", "type": "judge", "q": "生产经营单位依法建立隐患排查工作体系，其安全生产管理人员是隐患排查治理的第一责任人。", "options": [], "answer": ["F"], "explain": "主要负责人", "cat": 2, "catName": "安全生产责任与管理", "idx": 281}, {"no": 161, "section": "judge", "type": "judge", "q": "生产经营单位应当安排用于配备劳动防护用品、进行安全生产培训的经费。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 282}, {"no": 162, "section": "judge", "type": "judge", "q": "生产经营单位应当根据本单位的事故风险特点，每年至少组织一次综合应急预案演练或者专项应急预案演练， 每半年至少组织一次现场处置方案演练。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 283}, {"no": 163, "section": "judge", "type": "judge", "q": "生产经营单位应当建立安全生产教育和培训档案，如实记录安全生产教育和培训的时间、内容、参加人员以 及考核结果等情况。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 284}, {"no": 164, "section": "judge", "type": "judge", "q": "生产经营单位应当建立健全事故隐患排查治理和建档监控等制度，逐级建立并落实从主要负责人到每个从业 人员的隐患排查治理和监控责任制。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 285}, {"no": 165, "section": "judge", "type": "judge", "q": "生产经营单位应当具备安全生产条件所必需的资金投入，对由于安全生产所必需的资金投入不足导致的后果 承担责任。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 286}, {"no": 166, "section": "judge", "type": "judge", "q": "生产经营单位应当在有重大危险源、较大危险因素和严重职业病危害因素的生产经营场所和有关设施、设备 上，设置明显的安全警示标志和职业病危害警示标识。", "options": [], "answer": ["T"], "explain": "", "cat": 6, "catName": "机械与作业现场安全", "idx": 287}, {"no": 167, "section": "judge", "type": "judge", "q": "生产经营单位与从业人员订立劳动合同，在劳动合同中订立协议，其中有免除或者减轻其对从业人员因生产 安全事故伤亡依法应承担的责任的。该协议无效。", "options": [], "answer": ["T"], "explain": "", "cat": 9, "catName": "工伤保险与从业人员权益", "idx": 288}, {"no": 168, "section": "judge", "type": "judge", "q": "生产经营单位主要负责人和安全生产管理人员每年再培训时间不得少于 32 学时。", "options": [], "answer": ["F"], "explain": "12学时", "cat": 2, "catName": "安全生产责任与管理", "idx": 289}, {"no": 169, "section": "judge", "type": "judge", "q": "生产经营单位主要负责人和安全生产管理人员是安全生产保护的对象，企业员工往往因违章又成为事故主要 的直接肇事者，广大职工自觉拒绝违章，实现安全生产才有扎实基础。", "options": [], "answer": ["F"], "explain": "员工", "cat": 2, "catName": "安全生产责任与管理", "idx": 290}, {"no": 170, "section": "judge", "type": "judge", "q": "生产企业的从业人员需经安全生产教育和培训合格后方能上岗作业。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 291}, {"no": 171, "section": "judge", "type": "judge", "q": "生产任务与安全发生矛盾时，必须坚持“生产与安全对等重视”的原则。", "options": [], "answer": ["F"], "explain": "安全第一原则", "cat": 11, "catName": "综合判断题挑战", "idx": 292}, {"no": 172, "section": "judge", "type": "judge", "q": "生产始终把从业人员的经济收入放在首要位置，以人为本，但也要确保从业人员在生产过程中安全与健康， 需不断提高从业人员的安全素质和确保安全操作。", "options": [], "answer": ["F"], "explain": "安全", "cat": 11, "catName": "综合判断题挑战", "idx": 293}, {"no": 173, "section": "judge", "type": "judge", "q": "生产作业场所加强通风、隔离，可降低有毒有害气体的浓度。", "options": [], "answer": ["T"], "explain": "", "cat": 8, "catName": "职业病与劳动防护", "idx": 294}, {"no": 174, "section": "judge", "type": "judge", "q": "事故按程度可分为：特别重大事故、重大事故、较大事故、一般事故 4 类。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 295}, {"no": 175, "section": "judge", "type": "judge", "q": "事故发生单位负责人接到事故报告后，应当立即启动事故相应应急预案，或者采取有效措施，组织抢救，防 止事故扩大，减少人员伤亡和财产损失。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 296}, {"no": 176, "section": "judge", "type": "judge", "q": "双重绝缘是指工作绝缘（基本绝缘）和保护绝缘（ 附加绝缘） 。", "options": [], "answer": ["T"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 297}, {"no": 177, "section": "judge", "type": "judge", "q": "水是最常用的灭火剂，主要作用是降低着火物的温度，可以用于扑灭任何火灾。", "options": [], "answer": ["F"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 298}, {"no": 178, "section": "judge", "type": "judge", "q": "特种作业人员未按照规定经专门的安全作业培训，未取得相应资格，上岗作业导致事故的，应追究生产经营 单位有关人员的责任。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 299}, {"no": 179, "section": "judge", "type": "judge", "q": "特种作业是指在劳动过程中容易发生伤亡事故，对操作者本人，尤其对其他人和周围设施的安全有重大危害 的作业。 因此高层建筑物表面清洗工不属于特种作业。", "options": [], "answer": ["F"], "explain": "高处作业", "cat": 10, "catName": "应急救援与事故处理", "idx": 300}, {"no": 180, "section": "judge", "type": "judge", "q": "通过开展经常性的安全教育，提高操作者的安全素质，严格遵守安全操作规程，是预防事故的重要措施。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 301}, {"no": 181, "section": "judge", "type": "judge", "q": "通过企业自我检查、自我纠正、自我完善这一动态循环的管理模式，能够更好地促进企业安全绩效的持续改 进和安全生产长效机制的建立。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 302}, {"no": 182, "section": "judge", "type": "judge", "q": "同一生产经营场所和职工宿舍由两个以上单位管理和使用时，应当明确，选择一方承担全部安全责任， 并确定责任人对公用的疏散通道、安全出口进行统一管理。", "options": [], "answer": ["F"], "explain": "双方", "cat": 2, "catName": "安全生产责任与管理", "idx": 303}, {"no": 183, "section": "judge", "type": "judge", "q": "完整的事故应急演练活动包括：计划、准备、实施、评估总结和改进等五个阶段。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 304}, {"no": 184, "section": "judge", "type": "judge", "q": "王副镇长分管全镇的安全生产工作，他就是该镇安全生产第一责任人。", "options": [], "answer": ["F"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 305}, {"no": 185, "section": "judge", "type": "judge", "q": "危险源是事故发生的根源，通过危险因素分析对危险源进行辨识，是确定应急预防与应急救援对象的基础。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 306}, {"no": 186, "section": "judge", "type": "judge", "q": "为保证安全，在选择漏电保护器时，选择的额定动作电流越小越好。", "options": [], "answer": ["F"], "explain": "选择合适的电气原件", "cat": 5, "catName": "电气与触电安全", "idx": 307}, {"no": 187, "section": "judge", "type": "judge", "q": "未经培训上岗、操作者业务素质低、缺乏安全知识和自我保护能力、不懂安全操作技术、操作技能不熟练、 工作时注意力不集中、工作态度不负责、受外界影响而情绪波动、不遵守操作规程等都是事故的直接原因。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 308}, {"no": 188, "section": "judge", "type": "judge", "q": "物体打击事故主要有以下几类：（ 1）失手坠落打击伤害；（2）堆放不稳坠落伤人；（3）违章抛投物料伤 人；（4）吊运物体坠落伤人。", "options": [], "answer": ["T"], "explain": "", "cat": 7, "catName": "高处作业与有限空间", "idx": 309}, {"no": 189, "section": "judge", "type": "judge", "q": "现场急救人工呼吸口对口吹气法是效果最好、操作最简单的一种方法。操作前使伤员侧卧，救护者在其头的 一侧，一手托起伤员下颌，并尽量使其头部后仰，另一手将其鼻孔捏住，以免吹气时从鼻孔漏气。", "options": [], "answer": ["F"], "explain": "救护体位仰卧位", "cat": 11, "catName": "综合判断题挑战", "idx": 310}, {"no": 190, "section": "judge", "type": "judge", "q": "现代安全管理中的“ 四全”动态安全管理是：全员、全过程、全方位、全天候。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 311}, {"no": 191, "section": "judge", "type": "judge", "q": "消除、控制可燃物和着火源；满足防火间距是预防火灾的措施。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 312}, {"no": 192, "section": "judge", "type": "judge", "q": "消除燃烧三个基本条件中的任何一条。均能防止火灾的发生。如果采取消除燃烧条件中的两个条件，则更具 安全可靠性。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 313}, {"no": 193, "section": "judge", "type": "judge", "q": "消防安全重点单位应当实行每周防火巡查，并建立巡查记录。", "options": [], "answer": ["F"], "explain": "每日巡查", "cat": 4, "catName": "消防安全", "idx": 314}, {"no": 194, "section": "judge", "type": "judge", "q": "新工人入厂后因生产需要，可以先上岗后培训。", "options": [], "answer": ["F"], "explain": "岗前培训不可少", "cat": 2, "catName": "安全生产责任与管理", "idx": 315}, {"no": 195, "section": "judge", "type": "judge", "q": "一般隐患通常采取现场立即整改和限期整改的方式治理。属于违反操作规程和劳动纪律的不安全行为，以及 安全装置没有启用等不安全状态，可要求现场立即整改。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 316}, {"no": 196, "section": "judge", "type": "judge", "q": "一个企业在进行事故管理时， 对未遂事故可以不去理会它。", "options": [], "answer": ["F"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 317}, {"no": 197, "section": "judge", "type": "judge", "q": "一线员工在日常的工作中随时发现和处理各种隐患和事故苗头，自己不能解决的要及时上报，同时采取临时 性控制措施，做好记录，守住不发生人员伤亡的底线。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 318}, {"no": 198, "section": "judge", "type": "judge", "q": "依法建立健全隐患排查制度。包括 ：隐患排查的目标和任务、组织机构及职责、资金保障、 闭环管理程序、 记录（台账） 、隐患报告和举报奖励制度等。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 319}, {"no": 199, "section": "judge", "type": "judge", "q": "依据《中华人民共和国安全生产法》规定：生产经营单位的安全生产管理人员是本单位安全生产第一责任人， 对本单位的安全生产工作全面负责。其他负责人对职责范围内的安全生产工作负责。", "options": [], "answer": ["F"], "explain": "主要负责人", "cat": 1, "catName": "安全生产法律法规", "idx": 320}, {"no": 200, "section": "judge", "type": "judge", "q": "依据《中华人民共和国消防法》规定：机关、团体、企业、事业等单位应当落实消防安全责任制，制定本单 位的消防安全制度、消防安全操作规程，制定灭火和应急疏散预案。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 321}, {"no": 201, "section": "judge", "type": "judge", "q": "疑似职业病病人在诊断、 医学观察期间的费用， 由疑似职业病病人承担。", "options": [], "answer": ["F"], "explain": "生产经营单位", "cat": 8, "catName": "职业病与劳动防护", "idx": 322}, {"no": 202, "section": "judge", "type": "judge", "q": "易燃、易爆场所应加强通风，将混合气体浓度控制在爆炸极限以下。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 323}, {"no": 203, "section": "judge", "type": "judge", "q": "因生产安全事故受到损害的从业人员，向本单位提出赔偿要求，可以在依法享有工伤社会保险或者依照有关 民事法律获得赔偿两者之间任选一种。", "options": [], "answer": ["F"], "explain": "两者", "cat": 1, "catName": "安全生产法律法规", "idx": 324}, {"no": 204, "section": "judge", "type": "judge", "q": "隐患排查，要做到全员、全改，解决看不到风险、查不到隐患、不把隐患当回事的问题。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 325}, {"no": 205, "section": "judge", "type": "judge", "q": "隐患排查整治“五到位”是责任到位、措施到位、时限到位、人员到位、预案到位，切实把风险隐患消灭在 萌芽之时、成灾之前，解决排查不整改、搞形式主义的问题。", "options": [], "answer": ["F"], "explain": "资金到位", "cat": 3, "catName": "隐患排查与一线三排", "idx": 326}, {"no": 206, "section": "judge", "type": "judge", "q": "隐患排除中的重大隐患要依法采取现场立即整改和限期整改的方式治理。", "options": [], "answer": ["F"], "explain": "限期整改", "cat": 3, "catName": "隐患排查与一线三排", "idx": 327}, {"no": 207, "section": "judge", "type": "judge", "q": "隐患整改的三定是指：定时间、定责任人、定措施。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 328}, {"no": 208, "section": "judge", "type": "judge", "q": "隐患整治“五到位”指的是责任到位、措施到位、时限到位、人员到位、预案到位 ，防患于未然。", "options": [], "answer": ["F"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 329}, {"no": 209, "section": "judge", "type": "judge", "q": "应急救援抢险人员应根据事先拟定的抢险方案，在做好个体防护的基础上，以最快的速度排除险情，要严格 避免次生和衍生事故的发生。", "options": [], "answer": ["T"], "explain": "", "cat": 3, "catName": "隐患排查与一线三排", "idx": 330}, {"no": 210, "section": "judge", "type": "judge", "q": "应急预案的种类有：综合预案、专项预案、临时预案。", "options": [], "answer": ["F"], "explain": "现场预案", "cat": 10, "catName": "应急救援与事故处理", "idx": 331}, {"no": 211, "section": "judge", "type": "judge", "q": "应急预案是针对可能发生的突发事件，为迅速有序地开展应急行动而预先制定的行动方案。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 332}, {"no": 212, "section": "judge", "type": "judge", "q": "应急预案是针对可能发生的重大事故或灾害，为保证迅速、有序、有效地开展应急救援行动、降低事故损失 而现场制定的有关计划或方案。", "options": [], "answer": ["F"], "explain": "提前制定", "cat": 10, "catName": "应急救援与事故处理", "idx": 333}, {"no": 213, "section": "judge", "type": "judge", "q": "用机床加工工件时，刀具飞出伤人的事故，事故类别属于机械伤害。", "options": [], "answer": ["T"], "explain": "", "cat": 6, "catName": "机械与作业现场安全", "idx": 334}, {"no": 214, "section": "judge", "type": "judge", "q": "有限空间可导致窒息的气体包括：氧气、二氧化碳、 甲烷、 乙烷、水蒸气等。", "options": [], "answer": ["F"], "explain": "", "cat": 7, "catName": "高处作业与有限空间", "idx": 335}, {"no": 215, "section": "judge", "type": "judge", "q": "有限空间氧含量降至 10%以下，人可出现不同程度的意识障碍，甚至死亡；氧含量降至 6%以下，可发生 猝死。", "options": [], "answer": ["T"], "explain": "", "cat": 7, "catName": "高处作业与有限空间", "idx": 336}, {"no": 216, "section": "judge", "type": "judge", "q": "有限空间作业“七不”是指（ 1）、未经领导辨识不作业；（2）未经审批不作业；（3）未经培训演练不作 业；（4）未经通风和检测合格不作业；（ 5）没有监护不作业；（ 6）不佩戴劳动防护用品不作业；（ 7 ）电气设 备不符合规定不作业。", "options": [], "answer": ["F"], "explain": "未经风险辨识", "cat": 2, "catName": "安全生产责任与管理", "idx": 337}, {"no": 217, "section": "judge", "type": "judge", "q": "有限空间作业“七不”是指：①未经风险辨识不作业；②未经审批不作业；③未经培训演练不作业；④未经 通风和检测合格不作业；⑤没有监护不作业；⑥不佩戴劳动防护用品不作业；⑦电气设备不符合规定不作业。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 338}, {"no": 218, "section": "judge", "type": "judge", "q": "有限空间作业常见安全事故有：中毒、窒息事故；爆炸、火灾事故；淹溺事故；坍塌掩埋事故。", "options": [], "answer": ["T"], "explain": "", "cat": 4, "catName": "消防安全", "idx": 339}, {"no": 219, "section": "judge", "type": "judge", "q": "有限空间作业危险性大，作业人员中毒、窒息发生在瞬间，有的有毒气体中毒后数分钟，甚至数秒钟就会致 人死亡。", "options": [], "answer": ["T"], "explain": "", "cat": 7, "catName": "高处作业与有限空间", "idx": 340}, {"no": 220, "section": "judge", "type": "judge", "q": "预防事故、意外，就是要进行预想，预想越充分预防就越有效；企业员工全员参与，面越广，参与程度越深 预想充分性越好。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 341}, {"no": 221, "section": "judge", "type": "judge", "q": "预防是安全生产管理的主要工作，预防对避免事故发生起主要作用，安全生产工作的重心在于事前预防。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 342}, {"no": 222, "section": "judge", "type": "judge", "q": "在检维修、施工、 吊装等作业现场应设置警戒区域和警示标志。", "options": [], "answer": ["T"], "explain": "", "cat": 6, "catName": "机械与作业现场安全", "idx": 343}, {"no": 223, "section": "judge", "type": "judge", "q": "在施工现场，当高处作业中工作面的边沿没有围护设施或虽有围护设施，但其高度低于 80cm 时，这一类 作业称为临边作业。", "options": [], "answer": ["T"], "explain": "", "cat": 7, "catName": "高处作业与有限空间", "idx": 344}, {"no": 224, "section": "judge", "type": "judge", "q": "在事故应急预案的演习过程中，企业应让熟悉危险设施的工人、有关的安全管理人员一起参与。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 345}, {"no": 225, "section": "judge", "type": "judge", "q": "在逃生或避难的过程中一定要沉着冷静，大量的事故抢救现场和事实证明，在事故中乱窜乱跑往往是导致事 故中人员进一步伤亡的重要原因。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 346}, {"no": 226, "section": "judge", "type": "judge", "q": "在有爆炸危险的场所使用的电气设备最好选用防爆型的，为节省开支，也可选用普通型的。", "options": [], "answer": ["F"], "explain": "", "cat": 5, "catName": "电气与触电安全", "idx": 347}, {"no": 227, "section": "judge", "type": "judge", "q": "在直接责任者和领导责任者中，根据其在工作过程中的作用确定责任者。", "options": [], "answer": ["F"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 348}, {"no": 228, "section": "judge", "type": "judge", "q": "在制定具体事故预防措施时 ，问题与措施要一一对应，有主次、有轻重缓急。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 349}, {"no": 229, "section": "judge", "type": "judge", "q": "职工在生产过程中因违反安全操作规程发生伤亡事故，不属工伤事故。", "options": [], "answer": ["F"], "explain": "", "cat": 9, "catName": "工伤保险与从业人员权益", "idx": 350}, {"no": 230, "section": "judge", "type": "judge", "q": "职工在生产过程中因违反安全操作规程发生伤亡事故，属工伤事故。", "options": [], "answer": ["T"], "explain": "", "cat": 9, "catName": "工伤保险与从业人员权益", "idx": 351}, {"no": 231, "section": "judge", "type": "judge", "q": "职业病防治工作基本方针：全民防范 ，防治结合，分类管理，综合治理。", "options": [], "answer": ["F"], "explain": "预防为主", "cat": 2, "catName": "安全生产责任与管理", "idx": 352}, {"no": 232, "section": "judge", "type": "judge", "q": "只要不出安全事故，操作工人不必严格按《安全操作规程》操作。", "options": [], "answer": ["F"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 353}, {"no": 233, "section": "judge", "type": "judge", "q": "只要具备燃烧三要素（可燃物、助燃物、点火源） ，即会引起燃烧。", "options": [], "answer": ["F"], "explain": "需要达到燃点", "cat": 4, "catName": "消防安全", "idx": 354}, {"no": 234, "section": "judge", "type": "judge", "q": "中山市安委办开展安全生产大检查“安监 1710”行动是指“找准一个人，落实七件事”行动，也就是找准 企业主要负责人中的企业实际控制人，压实其七项安全生产职责，分十个步骤逐步推进。", "options": [], "answer": ["T"], "explain": "", "cat": 2, "catName": "安全生产责任与管理", "idx": 355}, {"no": 235, "section": "judge", "type": "judge", "q": "重大危险是指事故易发或事故一旦发生后果特别严重或者两种情况兼而有之。", "options": [], "answer": ["T"], "explain": "", "cat": 10, "catName": "应急救援与事故处理", "idx": 356}, {"no": 236, "section": "judge", "type": "judge", "q": "重大危险源是指长期或临时生产、搬运、使用或者储存危险物品，且危险物品的种类等于或者超过临界量单 元（包括场所和设施） 。", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 357}, {"no": 237, "section": "judge", "type": "judge", "q": "综合防尘措施可概括为“革、水、密、风、管、教、护、检。 ”", "options": [], "answer": ["T"], "explain": "", "cat": 11, "catName": "综合判断题挑战", "idx": 358}, {"no": 238, "section": "judge", "type": "judge", "q": "综合治理是需要政府、企业、员工、社会共同参与，各司其职，齐抓共管，运用法律、经济、行政、科技、 文化等各方面的综合措施来治理、解决安全生产中的问题，标本兼治，重在治本，建立长效机制。", "options": [], "answer": ["T"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 359}, {"no": 1, "section": "multi", "type": "multi", "q": "依据《职业病防治法》的规定，产生职业病危害的用人单位负有将职业危害公告的 义务，公告的内容包括（ )。", "options": [{"key": "A", "text": "职业病防治的规章制度"}, {"key": "B", "text": "职业病防治的操作规程"}, {"key": "C", "text": "职业病患者个人信息"}, {"key": "D", "text": "职业病危害事故应急救援措施"}, {"key": "E", "text": "工作场所职业病危害因素检测结果"}], "answer": ["A", "B", "D", "E"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 360}, {"no": 2, "section": "multi", "type": "multi", "q": "《安全生产法》的立法目的是（)。", "options": [{"key": "A", "text": "促进经济发展"}, {"key": "B", "text": "保障人民群众生命和财产安全"}, {"key": "C", "text": "规范生产经营单位行为"}, {"key": "D", "text": "为了加强安全生产工作"}, {"key": "E", "text": "防止和减少生产安全事故"}], "answer": ["A", "B", "D", "E"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 361}, {"no": 3, "section": "multi", "type": "multi", "q": "生产经营单位的决策机构及其主要负责人、个人经管的投资人未能保证安全生产所 必需的资金投入，使生产经营单位不具备安全生产条件，应该（)。", "options": [{"key": "A", "text": "责令限期改正，提供必需的资金，并处罚金"}, {"key": "B", "text": "逾期未改正的，责令停产停业整顿"}, {"key": "C", "text": "有违法行为，导致发生生产安全事故、构成犯罪的依照刑法有关规定追究刑事责任， 尚不构成刑事处罚的，对主要负责人给予撤职处分，对个人经营的投资处以罚款"}, {"key": "D", "text": "责令限期提供必需的资金"}, {"key": "E", "text": "直接给予经济处罚"}], "answer": ["B", "C", "D"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 362}, {"no": 4, "section": "multi", "type": "multi", "q": "以下对《安全生产法》的贯彻实施的重大意义说法正确的是（)。", "options": [{"key": "A", "text": "有利于全面加强我国安全生产法律法规体系建设"}, {"key": "B", "text": "有利于保障人民群众生命和财产安全"}, {"key": "C", "text": "有利于依法规范生产经营单位的安全生产工作"}, {"key": "D", "text": "有利于打击各种刑事犯罪"}, {"key": "E", "text": "有利于提高从业人员的安全素质"}], "answer": ["A", "B", "C", "E"], "explain": "", "cat": 1, "catName": "安全生产法律法规", "idx": 363}, {"no": 5, "section": "multi", "type": "multi", "q": "《安全生产法》第五十五条：从业人员发现直接危及人身安全的紧急情况时，有权 停止作业或者在采取可能的应急措施后撤离作业场所。在这种情况下不可以采取紧急 避险的人员有（ )。", "options": [{"key": "A", "text": "矿工"}, {"key": "B", "text": "飞行人员"}, {"key": "C", "text": "建筑工人"}, {"key": "D", "text": "船舶驾驶人员"}, {"key": "E", "text": "车辆驾驶人员"}], "answer": ["B", "D", "E"], "explain": "
