    S.list.forEach(function (q) { S.map[q.idx] = q; });
    // 优先级：localStorage 已存数据 > 文件内嵌的可携带快照 > 空白
    var src = readFallback() || global.QUESTLY_SAVED_STATE || null;
    if (src) {
      if (src.meta) S.meta = Object.assign(blankMeta(), src.meta);
      if (src.settings) saveSettings(src.settings);
      var recs = src.recs || {};
      Object.keys(recs).forEach(function (k) {
        var q = S.map[k] || S.map[Number(k)]; if (!q) return;
        applyRec(q, recs[k]);
      });
    } else {
      S.meta = blankMeta();
    }
    S.loaded = true;
    flushFallback(); // 立即写回 localStorage，后续打开以 localStorage 为准（内嵌快照仅首次生效）
    return S;
  }

  function init() {
    if (S.ready) return S.ready;
    // 带「可携带数据」的文件（发到手机用的版本）：跳过 IndexedDB，直接以 localStorage 持久化，
    // 保证在手机 file:// 上也能原样还原进度，且后续改动不丢失。
    if (global.QUESTLY_SAVED_STATE) { S.ready = Promise.resolve(fallbackMemory()); return S.ready; }
    S.persist = true;
    S.ready = seed(false).then(loadAll).then(function () {
      if (!S.list.length) throw new Error('empty');
      checkAch();
      return S;
    }).catch(function () {
      // IndexedDB 被禁用 / 隐私模式 / file:// 限制 → 退回内存 + localStorage 模式
      fallbackMemory();
      checkAch();
      return S;
    });
    return S.ready;
  }

  /* ---------- counts & stats ---------- */
  function counts() {
    var c = { total: S.list.length, single: 0, judge: 0, multi: 0, answered: 0, correct: 0, wrong: 0, fav: 0, masteredWrong: 0, judgeTotal: 0, judgeAnswered: 0, multiTotal: 0, multiAnswered: 0, combo: S.meta.combo, comboBest: S.meta.comboBest, examXp: S.meta.examXp, star3: S.meta.star3, bossDone: S.meta.bossDone, bossBestRate: S.meta.bossBestRate, needsReview: 0 };
    S.list.forEach(function (q) {
      if (q.type === 'single') c.single++;
      if (q.type === 'judge') { c.judgeTotal++; if (q.answered) c.judgeAnswered++; }
      if (q.type === 'multi') { c.multiTotal++; if (q.answered) c.multiAnswered++; }
      if (q.answered) { c.answered++; if (q.firstCorrect) c.correct++; }
      if (q.inWrong) c.wrong++;
      if (q.fav) c.fav++;
      if (q.mastered) c.masteredWrong++;
      if (q.needsReview) c.needsReview++;
    });
    c.accuracy = c.answered ? Math.round(c.correct / c.answered * 100) : 0;
    c.firstCorrectRate = c.answered ? Math.round(c.correct / c.answered * 100) : 0;
    return c;
  }

  function importReport() {
    var c = counts();
    var dup = 0; var seen = {};
    S.list.forEach(function (q) { seen[q.q] = (seen[q.q] || 0) + 1; });
    Object.keys(seen).forEach(function (k) { if (seen[k] > 1) dup++; });
    var missingAnswer = S.list.filter(function (q) { return !q.answer || !q.answer.length; }).length;
    return {
      total: c.total, single: c.single, judge: c.judge, multi: c.multi,
      needsReview: c.needsReview, missingAnswer: missingAnswer, duplicates: dup,
      answered: c.answered, correct: c.correct, accuracy: c.accuracy
    };
  }

  /* ---------- 备考指数 ---------- */
  function prepIndex() {
    var c = counts();
    var completion = c.total ? c.answered / c.total : 0;
    var fcr = c.answered ? c.correct / c.answered : 0;
    var wrongTotal = S.list.filter(function (q) { return q.inWrong || (q.needsReview); }).length;
    var reviewed = S.list.filter(function (q) { return q.mastered; }).length;
    var wrongComp = wrongTotal ? reviewed / wrongTotal : 1;
    var h = S.meta.history[todayKey()];
    var recent = h && h.done > 0 ? 1 : 0;
    if (S.meta.lastStudyDate) {
      var diff = Math.round((Date.now() - new Date(S.meta.lastStudyDate).getTime()) / dayMs());
      if (diff <= 2) recent = 1; else if (diff <= 7) recent = 0.5;
    }
    var score = completion * 40 + fcr * 30 + wrongComp * 20 + recent * 10;
    return Math.max(0, Math.min(100, Math.round(score)));
  }
  function prepStatus(v) {
    if (v >= 95) return '全题库通关';
    if (v >= 85) return '准备充分';
    if (v >= 70) return '冲刺阶段';
    if (v >= 50) return '进入状态';
    if (v >= 30) return '正在积累';
    return '刚刚开始';
  }

  /* ---------- 倒计时 ---------- */
  function parseExamDate() {
    var d = new Date(S.settings.examDate + 'T09:00:00');
    if (isNaN(d.getTime())) d = new Date(DEFAULT_SETTINGS.examDate + 'T09:00:00');
    if (isNaN(d.getTime())) d = new Date(Date.now() + 30 * dayMs());
    return d;
  }
  function examCountdown() {
    var target = parseExamDate();
    var now = Date.now();
    var diff = Math.max(0, target - now);
    var days = Math.floor(diff / dayMs());
    var hours = Math.floor((diff % dayMs()) / 3600000);
    return { days: days, hours: hours, ms: diff };
  }
  function daysLeft() {
    var target = parseExamDate();
    var now = Date.now();
    return Math.max(0, Math.ceil((target - now) / dayMs()));
  }

  /* ---------- 关卡地图 ---------- */
  function levelMap() {
    var defs = [
      [1, '安全生产法律法规'], [2, '安全生产责任与管理'], [3, '隐患排查与一线三排'],
      [4, '消防安全'], [5, '电气与触电安全'], [6, '机械与作业现场安全'],
      [7, '高处作业与有限空间'], [8, '职业病与劳动防护'], [9, '工伤保险与从业人员权益'],
      [10, '应急救援与事故处理']
    ];
    var levels = defs.map(function (d) {
      var qs = S.list.filter(function (q) { return q.cat === d[0]; });
      return buildLevel(d[0] + '', d[1], qs);
    });
    levels.push(buildLevel('11', '综合判断题挑战', S.list.filter(function (q) { return q.type === 'judge'; })));
    levels.push(buildLevel('12', '多选题终极挑战', S.list.filter(function (q) { return q.type === 'multi'; })));
    return levels;
  }
  function buildLevel(id, name, qs) {
    var total = qs.length, done = 0, correct = 0;
    var weak = {};
    qs.forEach(function (q) { if (q.answered) { done++; if (q.firstCorrect) correct++; } if (q.inWrong) weak[q.catName] = (weak[q.catName] || 0) + 1; });
    var rate = done ? Math.round(correct / done * 100) : 0;
    var allWrong = qs.filter(function (q) { return q.inWrong; });
    var stars = 0;
    if (done === total && total) stars = 1;
    if (stars && rate >= 80) stars = 2;
    if (stars === 2 && rate >= 90 && allWrong.length === 0) stars = 3;
    if (stars === 3) S.meta.star3 = true;
    var weakArr = Object.keys(weak).map(function (k) { return { name: k, n: weak[k] }; }).sort(function (a, b) { return b.n - a.n; });
    return { id: id, name: name, total: total, done: done, rate: rate, stars: stars, weak: weakArr.slice(0, 3), unlocked: true };
  }

  /* ---------- 每日计划 ---------- */
  function dailyPlan() {
    var c = counts();
    var remaining = c.total - c.answered;
    var dl = daysLeft();
    if (!isFinite(dl) || dl < 1) dl = 1;
    var base = remaining > 0 ? Math.max(1, Math.ceil(remaining / Math.max(1, dl))) : 0;
    if (!isFinite(base)) base = 0;
    var g = S.settings.groupSize || 10;
    var parts = [
      { label: '上午', n: Math.round(base * 0.35) },
      { label: '午间', n: Math.round(base * 0.3) },
      { label: '晚间', n: Math.round(base * 0.25) },
      { label: '睡前错题', n: Math.max(0, base - Math.round(base * 0.9)) }
    ];
    parts.forEach(function (p) { if (!isFinite(p.n) || p.n < 0) p.n = 0; });
    var sum = parts.reduce(function (a, p) { return a + p.n; }, 0);
    if (sum < base) parts[2].n += base - sum;
    return { target: base, group: g, parts: parts, minutes: S.settings.dailyMinutes || 60 };
  }

  /* ---------- 选下一题 ---------- */
  function pickNext(opts) {
    opts = opts || {};
    var pool = S.list.slice();
    if (opts.type) pool = pool.filter(function (q) { return q.type === opts.type; });
    if (opts.cat) pool = pool.filter(function (q) { return q.cat === opts.cat; });
    if (opts.scope) {
      if (opts.scope === 'wrong') pool = pool.filter(function (q) { return q.inWrong; });
      else if (opts.scope === 'fav') pool = pool.filter(function (q) { return q.fav; });
      else if (opts.scope === 'unmastered') pool = pool.filter(function (q) { return !q.mastered; });
    }
    if (S.settings.prioritizeWrong && !opts.includeCorrect) {
      var w = pool.filter(function (q) { return q.inWrong; });
      if (w.length) pool = w;
      else if (!opts.includeCorrect) pool = pool.filter(function (q) { return !q.answered; });
    } else if (!opts.includeCorrect) {
      pool = pool.filter(function (q) { return !q.answered; });
    }
    pool = pool.filter(function (q) { return !(q.needsReview && !opts.force); });
    if (!pool.length && opts.includeCorrect) pool = S.list.filter(function (q) { return !q.needsReview; });
    if (!pool.length) return null;
    return pool[Math.floor(Math.random() * pool.length)].idx;
  }

  /* ---------- 答题 ---------- */
  function answer(idx, ua) {
    var q = S.map[idx]; if (!q) return null;
    var correct = isCorrect(q, ua);
    var firstAttempt = !q.answered;
    var xp = 0;
    q.attempts++;
    q.lastAnswered = Date.now();
    q.userAnswer = ua.slice();
    q.answered = true;
    if (correct) {
      q.consecutiveCorrect = (q.consecutiveCorrect || 0) + 1;
      if (firstAttempt) { q.firstCorrect = true; q.status = 'learning'; xp = 5; }
      else if (q.inWrong) { xp = 2; }
      else { xp = 1; }
      if (q.inWrong && q.consecutiveCorrect >= 2) { q.mastered = true; q.inWrong = false; q.wrongStage = 3; q.status = 'mastered'; }
      else if (q.inWrong) { q.wrongStage = q.consecutiveCorrect; }
    } else {
      q.consecutiveCorrect = 0;
      q.errors++;
      if (!q.firstCorrect) q.firstCorrect = false;
      q.inWrong = true; q.wrongStage = 0; q.status = 'learning';
    }
    // combo
    if (correct) { S.meta.combo++; if (S.meta.combo > S.meta.comboBest) S.meta.comboBest = S.meta.combo; }
    else { S.meta.combo = 0; }
    // xp to shared system
    if (xp) store.addXp(xp, 'exam');
    S.meta.examXp += xp;
    // daily history
    var k = todayKey();
    var h = S.meta.history[k] || (S.meta.history[k] = { done: 0, correct: 0, firstCorrect: 0, errors: 0, mastered: 0, xp: 0, weak: {} });
    h.done++; if (correct) { h.correct++; if (firstAttempt) h.firstCorrect++; } else h.errors++;
    h.xp += xp; if (q.inWrong && q.mastered && !h._mc) { h.mastered++; h._mc = true; }
    if (!h.weak[q.catName]) h.weak[q.catName] = 0; if (!correct) h.weak[q.catName]++;
    // study streak
    if (!S.meta.lastStudyDate || dateKeyFrom(S.meta.lastStudyDate) !== k) {
      if (S.meta.lastStudyDate && Math.round((Date.now() - new Date(S.meta.lastStudyDate).getTime()) / dayMs()) === 1) S.meta.studyStreak++;
      else if (!S.meta.lastStudyDate) S.meta.studyStreak = 1;
      else if (dateKeyFrom(S.meta.lastStudyDate) !== k) S.meta.studyStreak = 1;
      S.meta.lastStudyDate = Date.now();
    }
    var unlocked = checkAch();
    saveRec(q); saveMeta();
    return {
      correct: correct, xp: xp, combo: S.meta.combo, comboBest: S.meta.comboBest,
      comboBroken: !correct, firstAttempt: firstAttempt, unlocked: unlocked,
      leveledUp: false, q: q
    };
  }

  /* ---------- 成就 ---------- */
  function checkAch() {
    var c = counts(); c.star3 = S.meta.star3; c.bossDone = S.meta.bossDone; c.bossBestRate = S.meta.bossBestRate;
    var newly = [];
    ACH.forEach(function (a) {
      var v = a.get(c);
      if (v >= a.goal && !S.meta.unlocked[a.id]) { S.meta.unlocked[a.id] = Date.now(); newly.push(a); }
    });
    if (newly.length) saveMeta();
    return newly;
  }

  /* ---------- Boss / 模拟考 / 速览 ---------- */
  function bossSession() {
    var pool = S.list.filter(function (q) { return !q.needsReview; });
    var wrong = shuffle(pool.filter(function (q) { return q.inWrong; }));
    var unans = shuffle(pool.filter(function (q) { return !q.answered; }));
    var rest = shuffle(pool.filter(function (q) { return !q.inWrong && q.answered; }));
    var pick = [];
    function take(arr, n) { while (n-- > 0 && arr.length) pick.push(arr.shift().idx); }
    take(wrong, 10); take(unans, 7); take(rest, 3);
    if (pick.length < 20) { var s = shuffle(pool.map(function (q) { return q.idx; })); take(s, 20 - pick.length); }
    return shuffle(pick).slice(0, 20);
  }
  function mockSession(cfg) {
    cfg = cfg || {};
    var out = [];
    function take(type, n) {
      var pool = S.list.filter(function (q) { return q.type === type && !q.needsReview; });
      if (cfg.prioritizeWrong) pool.sort(function (a, b) { return (b.inWrong ? 1 : 0) - (a.inWrong ? 1 : 0); });
      if (cfg.excludeMastered) pool = pool.filter(function (q) { return !q.mastered; });
      pool = shuffle(pool);
      for (var i = 0; i < n && i < pool.length; i++) {
        var q = pool[i];
        var order = q.options.map(function (o) { return o.key; });
        if (cfg.shuffleOpt && q.type !== 'judge') order = shuffle(order);
        out.push({ idx: q.idx, order: order });
      }
    }
    take('single', cfg.single || 0); take('judge', cfg.judge || 0); take('multi', cfg.multi || 0);
    if (cfg.shuffleQ) out = shuffle(out);
    return out;
  }
  function quickSet(kind) {
    var list;
    if (kind === 'recentWrong') list = S.list.filter(function (q) { return q.inWrong; }).sort(function (a, b) { return (b.lastAnswered || 0) - (a.lastAnswered || 0); });
    else if (kind === 'freqWrong') list = S.list.filter(function (q) { return q.inWrong; }).sort(function (a, b) { return b.errors - a.errors; });
    else if (kind === 'fav') list = S.list.filter(function (q) { return q.fav; });
    else if (kind === 'multi') list = S.list.filter(function (q) { return q.type === 'multi' && !q.needsReview; });
    else if (kind === 'unmastered') list = S.list.filter(function (q) { return q.inWrong; });
    else { // pre10 考前10分钟速览
      var kw = ['罚款', '拘留', '年', '万元', '期限', '责任', '不得', '应当', '必须', '标准', '%'];
      list = S.list.filter(function (q) {
        if (q.fav) return true;
        if (q.inWrong) return true;
        if (q.type === 'judge' && /不|错误|误/.test(q.q)) return true;
        return kw.some(function (k) { return q.q.indexOf(k) >= 0; });
      }).slice(0, 20);
    }
    return list.map(function (q) { return q.idx; });
  }

  /* ---------- AI 考试教练（本地规则） ---------- */
  function aiCoach(kind, ctx) {
    var c = counts();
    if (kind === 'todayPlan') {
      var p = dailyPlan();
      return { title: '今日学习任务', source: 'local',
        lines: ['距离考试还有 ' + examCountdown().days + ' 天，今日目标：完成 ' + p.target + ' 题。',
          p.parts.map(function (x) { return '· ' + x.label + '：' + x.n + ' 题'; }).join('\n'),
          '建议优先复习错题（当前错题 ' + c.wrong + ' 道），再推进未做题。'] };
    }
    if (kind === 'weak') {
      var h = S.meta.history[todayKey()];
      var w = h ? Object.keys(h.weak).sort(function (a, b) { return h.weak[b] - h.weak[a]; }) : [];
      return { title: '薄弱知识点', source: 'local',
        lines: w.length ? w.slice(0, 5).map(function (k) { return '· ' + k + '：今日错 ' + h.weak[k] + ' 题'; }) : ['暂无明显薄弱点，继续保持！'] };
    }
    if (kind === 'order') {
      var lv = levelMap().filter(function (l) { return l.done < l.total; }).sort(function (a, b) { return (a.done / a.total) - (b.done / b.total); });
      return { title: '建议复习顺序', source: 'local',
        lines: lv.slice(0, 5).map(function (l, i) { return (i + 1) + '. ' + l.name + '（' + l.done + '/' + l.total + '）'; }) };
    }
    if (kind === 'summary') {
      var hh = S.meta.history[todayKey()];
      return { title: '今日表现', source: 'local',
        lines: hh ? ['完成 ' + hh.done + ' 题，正确率 ' + (hh.done ? Math.round(hh.correct / hh.done * 100) : 0) + '%，获得 ' + hh.xp + ' XP。',
          hh.errors ? '错题 ' + hh.errors + ' 道，记得睡前复习。' : '今日零失误，状态很好！'] :
          ['今天还没开始答题，先完成最小一组 ' + (S.settings.groupSize || 10) + ' 题吧。'] };
    }
    if (kind === 'similar' && ctx && ctx.idx != null) {
      var q = S.map[ctx.idx];
      var sim = S.list.filter(function (x) { return x.idx !== q.idx && (x.cat === q.cat || (x.q.indexOf(q.q.slice(0, 6)) >= 0)); }).slice(0, 5);
      return { title: '相似题目', source: 'local',
        lines: sim.length ? sim.map(function (x) { return '· ' + x.q.slice(0, 24) + '…'; }) : ['暂未找到相似题目。'] };
    }
    if (kind === 'explain' && ctx && ctx.idx != null) {
      var qq = S.map[ctx.idx];
      var lines = [];
      if (qq.explain) lines.push('【原题库解析】' + qq.explain);
      if (qq.note) lines.push('【你的笔记】' + qq.note);
      lines.push('【AI辅助说明】此题属于「' + qq.catName + '」，正确答案：' + (qq.type === 'judge' ? (qq.answer[0] === 'T' ? '正确' : '错误') : qq.answer.join('、')) + '。请以培训教材和正式考试要求为准。');
      return { title: '题目解析', source: 'local', lines: lines };
    }
    return { title: 'AI 考试教练', source: 'local', lines: ['当前为本地分析模式，已根据你的答题记录整理学习建议。'] };
  }

  /* ---------- 收藏 / 笔记 / 标记 ---------- */
  function toggleFav(idx) { var q = S.map[idx]; if (!q) return; q.fav = !q.fav; saveRec(q); }
  function setNote(idx, note, tag) { var q = S.map[idx]; if (!q) return; q.note = note || ''; q.noteTag = tag || ''; saveRec(q); }
  function flag(idx, v) { var q = S.map[idx]; if (!q) return; q.flag = (v == null) ? !q.flag : v; saveRec(q); }

  /* ---------- 导入导出 / 重置 ---------- */
  function exportData() {
    return { version: 1, exportedAt: Date.now(), settings: S.settings, meta: S.meta, questions: S.list };
  }
  // 仅导出「作答状态」这一小块（题干始终从 bank 重新加载），体积很小，可写回文件实现可携带。
  function buildRecs() {
    var recs = {};
    S.list.forEach(function (q) {
      if (!q.answered && !q.fav && !q.note && !q.flag) return;
      recs[q.idx] = [q.answered ? 1 : 0, q.firstCorrect ? 1 : 0, q.attempts, q.errors,
        q.fav ? 1 : 0, q.inWrong ? 1 : 0, q.consecutiveCorrect, q.mastered ? 1 : 0,
        q.wrongStage, q.lastAnswered, q.note || '', q.flag ? 1 : 0];
    });
    return recs;
  }
  /* 生成「含当前数据的单文件」：把状态烘焙进当前 HTML 并下载，可直接发到手机。 */
  function exportPortable() {
    var payload = { meta: S.meta, recs: buildRecs(), settings: S.settings, exportedAt: Date.now() };
    var state = JSON.stringify(payload).replace(/</g, '\\u003c'); // 防止笔记里的 < 破坏 <script>
    var html = document.documentElement.outerHTML;
    // 去掉已有的内嵌快照，避免重复与陈旧
    html = html.replace(/<script>\s*window\.QUESTLY_SAVED_STATE[\s\S]*?<\/script>/i, '');
    var tag = '<script>window.QUESTLY_SAVED_STATE=' + state + ';<\/script>';
    // 必须注入到 <head> 内（在任何业务脚本之前），否则 init() 启动时还读不到快照
    html = html.replace(/<head[^>]*>/i, function (m) { return m + '\n' + tag; });
    var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'questly-我的闯关数据.html';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1500);
    return html;
  }
  function importData(data) {
    if (!data || !data.questions) return Promise.reject(new Error('bad-file'));
    if (!S.persist) {
      S.list = data.questions; S.map = {};
      S.list.forEach(function (q) { S.map[q.idx] = q; });
      if (data.meta) S.meta = Object.assign(blankMeta(), data.meta);
      if (data.settings) saveSettings(data.settings);
      flushFallback();
      return Promise.resolve(true);
    }
    return openDB().then(function () {
      var tx = dbp.transaction('questions', 'readwrite');
      data.questions.forEach(function (q) { tx.objectStore('questions').put(q); });
      return new Promise(function (res) { tx.oncomplete = function () { res(true); }; });
    }).then(function () { if (data.meta) S.meta = data.meta; if (data.settings) saveSettings(data.settings); return loadAll(); });
  }
  function resetRecords() {
    S.list.forEach(function (q) { extendRec(q); });
    S.meta = blankMeta();

    html += '<div class="exam-imp__rows">' +
      impRow('待人工校对（格式异常）', r.needsReview, r.needsReview ? 'warn' : 'ok') +
      impRow('缺少答案', r.missingAnswer, r.missingAnswer ? 'warn' : 'ok') +
    '</div>';
    html += '</div><p class="muted exam-imp__note">原题库内容已原样保留，仅清理多余空格与换行；未修改任何法律名称、数字或答案。</p></div></div>';

    // 设置
    var examDate = s.examDate || '';
    var dailyMin = (typeof s.dailyMinutes === 'number') ? s.dailyMinutes : 45;
    var groupSize = (typeof s.groupSize === 'number') ? s.groupSize : 10;
    html += '<div class="card"><div class="card__head"><h3>考试与学习计划</h3></div><div class="card__body">';
    html += '<div class="exam-set">' +
      '<div class="field"><label>考试日期</label><input class="input" id="set-date" type="date" value="' + esc(examDate) + '"></div>' +
      '<div class="field"><label>每天可学习（分钟）</label><input class="input" id="set-min" type="number" value="' + dailyMin + '" min="1"></div>' +
      '<div class="field"><label>每组题目数量</label><input class="input" id="set-group" type="number" value="' + groupSize + '" min="1"></div>' +
    '</div>';
    html += '<div class="exam-set__switches">' +
      chkRow('set-inc', '包含已做对的题', s.includeCorrect) +
      chkRow('set-pw', '优先复习错题', s.prioritizeWrong) +
      chkRow('set-sound', '开启答题音效', s.sound) +
    '</div>';
    html += '<button class="btn btn--primary btn--block" data-ea="settings-save">保存设置</button>';
    html += '</div></div>';

    // 数据管理
    html += '<div class="card"><div class="card__head"><h3>数据管理</h3></div><div class="card__body">' +
      '<div class="exam-data">' +
        '<button class="btn btn--primary" data-ea="export-portable">' + I.bolt + '导出可携带文件</button>' +
        '<button class="btn btn--outline" data-ea="export-json">' + I.down + '导出学习数据</button>' +
        '<button class="btn btn--outline" data-ea="import-json">' + I.up + '导入数据</button>' +
        '<button class="btn btn--outline" data-ea="reimport">重新导入题库</button>' +
        '<button class="btn btn--danger" data-ea="reset-records">清空答题记录</button>' +
      '</div>' +
      '<input type="file" id="exam-import-file" accept="application/json" hidden>' +
      '<p class="muted exam-imp__note">「可携带文件」是自带你全部进度的单 HTML，发到手机用浏览器打开即可继续刷题；手机上的新进度会自动保存在本机。执行清空 / 重置前会二次确认，且无法恢复。</p>' +
    '</div></div>';
    return html;
  }
  function impRow(k, v, kind) {
    return '<div class="exam-imp__row' + (kind === 'warn' ? ' exam-imp__row--warn' : '') + '"><span>' + esc(k) + '</span><b>' + fmt(v) + '</b></div>';
  }

  /* ============ 答题（沉浸页） ============ */
  function mkSession(ids, orders, mode, extra) {
    var s = {
      ids: ids, order: orders, i: 0, mode: mode, sel: [],
      correct: 0, wrong: 0, firstCorrect: 0, start: Date.now(),
      comboMax: exam.meta().combo, newWrong: 0, weak: {}, answers: {},
      timed: false, timeLimit: 0, remain: 0, _beforeXp: exam.meta().examXp
    };
    return Object.assign(s, extra || {});
  }
  function defOrder(ids) {
    return ids.map(function (i) { var q = exam.get(i); return (q && q.options ? q.options : []).map(function (o) { return o.key; }); });
  }

  function startSession(opts) {
    opts = opts || {};
    var ids;
    if (opts.cat) {
      var cat = String(opts.cat);
      ids = exam.all().filter(function (q) {
        if (q.needsReview) return false;
        if (cat === '11') return q.type === 'judge';
        if (cat === '12') return q.type === 'multi';
        return q.cat === Number(cat);
      }).map(function (q) { return q.idx; });
      if (!opts.all) {
        var todo = ids.filter(function (i) { return !exam.get(i).answered || exam.get(i).inWrong; });
        if (todo.length) ids = todo;
      }
      ids = ids.slice(0, Math.max(exam.settings().groupSize || 10, 10));
    } else if (opts.scope === 'wrong') {
      ids = exam.all().filter(function (q) { return q.inWrong; }).map(function (q) { return q.idx; });
    } else if (opts.scope === 'fav') {
      ids = exam.all().filter(function (q) { return q.fav; }).map(function (q) { return q.idx; });
    } else if (opts.single != null) {
      ids = [opts.single];
    } else {
      var n = exam.settings().groupSize || 10;
      var inc = exam.settings().includeCorrect;
      var seen = {};
      ids = [];
      for (var i = 0; i < n * 4 && ids.length < n; i++) {
        var x = exam.pickNext({ includeCorrect: inc });
        if (x == null) break;
        if (seen[x]) continue;
        seen[x] = 1; ids.push(x);
      }
    }
    if (!ids || !ids.length) { toast('没有符合条件的题目，去关卡地图看看吧', 'warn'); return; }
    EP.session = mkSession(ids, defOrder(ids), opts.mode || 'group');
    goto('examPlay');
  }
  function startBoss() {
    var ids = exam.bossSession();
    if (!ids.length) { toast('题库为空，请先在设置里重新导入题库', 'warn'); return; }
    var timer = $('#boss-timer') ? $('#boss-timer').checked : true;
    EP.session = mkSession(ids, defOrder(ids), 'boss', { timed: timer, timeLimit: 900, remain: 900, instant: false });
    goto('examPlay');
  }
  function startMock(cfg) {
    var arr = exam.mockSession(cfg);
    if (!arr.length) { toast('没有可生成的题目，请调整数量后重试', 'warn'); return; }
    EP.session = mkSession(
      arr.map(function (x) { return x.idx; }),
      arr.map(function (x) { return x.order; }),
      'mock',
      { timed: true, timeLimit: (cfg.time || 30) * 60, remain: (cfg.time || 30) * 60, goal: cfg.goal || 80, instant: false }
    );
    goto('examPlay');
  }

  function fmtClock(sec) {
    sec = Math.max(0, sec | 0);
    var m = Math.floor(sec / 60), r = sec % 60;
    return m + ':' + (r < 10 ? '0' : '') + r;
  }
  function modeName(m) { return m === 'boss' ? 'Boss 战' : m === 'mock' ? '模拟考' : '闯关练习'; }

  function renderPlay() {
    var s = EP.session; if (!s) { setTimeout(function () { goto('exam'); }, 0); return ''; }
    var q = exam.get(s.ids[s.i]);
    if (!q) { setTimeout(function () { goto('exam'); }, 0); return ''; }
    var total = s.ids.length;
    var order = s.order[s.i] && s.order[s.i].length ? s.order[s.i] : (q.options || []).map(function (o) { return o.key; });
    var typ = q.type;
    var pct = Math.round(s.i / total * 100);
    var html = '<div class="play">';

    // 顶栏
    html += '<header class="play__bar">';
    html += '<button class="play__back" data-ea="back-exam" title="退出并保存进度">← 退出</button>';
    html += '<div class="play__meta"><span class="tag tag--' + typ + '">' + typeName(typ) + '</span>' +
            '<span class="play__mode">' + modeName(s.mode) + '</span>' +
            '<span class="muted">第 ' + (s.i + 1) + ' / ' + total + ' 题</span></div>';
    html += '<div class="play__nums">' +
            '<span id="play-combo" class="play__combo' + (exam.meta().combo >= 3 ? ' is-hot' : '') + '">🔥 连击 ' + exam.meta().combo + '</span>' +
            '<span id="play-xp">' + I.bolt + ' ' + exam.meta().examXp + ' XP</span>' +
            (s.timed ? '<span class="play__timer" id="play-timer">⏱ ' + fmtClock(s.remain) + '</span>' : '') +
            '</div>';
    html += '</header>';
    html += '<div class="play__progress"><i style="width:' + pct + '%"></i></div>';

    // 题目卡片
    html += '<div class="play__card" id="play-card">';
    html += '<div class="play__no">题库原第 ' + q.no + ' 题 · ' + esc(q.catName) +
            (q.needsReview ? ' · <span class="warn">此题原文格式异常，待人工校对</span>' : '') + '</div>';
    html += '<div class="play__q">' + esc(q.q) + '</div>';
    if (typ === 'judge') {
      html += '<div class="play__judge">' +
        '<button class="play__judge-btn" data-opt="T"><b>√</b>正确</button>' +
        '<button class="play__judge-btn" data-opt="F"><b>×</b>错误</button></div>';
    } else {
      html += '<div class="play__opts">';
      order.forEach(function (k) {
        var o = (q.options || []).filter(function (x) { return x.key === k; })[0]; if (!o) return;
        html += '<button class="play__opt" data-opt="' + k + '"><span class="play__opt-k">' + k + '</span><span class="play__opt-t">' + esc(o.text) + '</span></button>';
      });
      html += '</div>';
      if (typ === 'multi') html += '<div class="play__hint">' + I.target + ' 本题为多选，选完后再点提交</div>';
    }
    html += '</div>';

    // 底部操作
    html += '<footer class="play__foot">';
    html += '<button class="btn btn--ghost" data-ea="fav-play" data-idx="' + q.idx + '">' + (q.fav ? '★ 已收藏' : '☆ 收藏') + '</button>';
    html += '<button class="btn btn--ghost" data-ea="note-play" data-idx="' + q.idx + '">✎ 笔记</button>';
    html += '<button class="btn btn--ghost" data-ea="skip">跳过</button>';
    html += '<button class="btn btn--primary btn--lg play__submit" data-submit disabled>提交答案</button>';
    html += '</footer>';
    html += '</div>';
    return html;
  }

  function nextOrSettle() {
    var s = EP.session; if (!s) return;
    if (s.i >= s.ids.length - 1) { showSettlement(); return; }
    s.i++; s.sel = [];
    var pc = document.getElementById('page-examPlay');
    if (pc) {
      pc.innerHTML = renderPlay();
      var card = pc.querySelector('.play__card');
      if (card) { card.classList.add('fx-slidein'); }
    }
  }

  function submitCurrent() {
    var s = EP.session; if (!s) return;
    var q = exam.get(s.ids[s.i]);
    var sel = (s.sel || []).slice();
    if (!sel.length) return;

    var res = exam.answer(q.idx, sel);
    s.answers[q.idx] = { sel: sel, correct: res.correct };
    s.comboMax = Math.max(s.comboMax, res.combo);
    if (res.correct) { s.correct++; if (res.firstAttempt) s.firstCorrect++; }
    else { s.wrong++; s.newWrong++; s.weak[q.catName] = (s.weak[q.catName] || 0) + 1; }

    var instant = s.mode === 'group';
    if (instant) paintFeedback(q, sel, res);
    else lockOptions();

    if (res.correct) {
      if (res.xp) fx.xpFloat($('#play-card'), '+' + res.xp + ' XP');
      fx.sfx.complete();
      if (res.combo >= 3 && res.combo % 1 === 0 && Q.exam.COMBO_TITLES[res.combo]) {
        toast('连击 ' + res.combo + ' · ' + Q.exam.COMBO_TITLES[res.combo]);
        fx.spawn(global.innerWidth / 2, global.innerHeight * 0.4, { count: 14, power: 7, size: 6, life: 55 });
      }
    } else {
      fx.sfx.undo();
      var card = $('#play-card');
      if (card) { card.classList.remove('fx-shake'); void card.offsetWidth; card.classList.add('fx-shake'); }
    }
    if (res.unlocked && res.unlocked.length) {
      res.unlocked.forEach(function (a, i) { setTimeout(function () { fx.sfx.unlock(); toast('解锁备考成就：' + a.icon + ' ' + a.name); }, 420 + i * 520); });
    }

    // 顶栏刷新
    var cb = $('#play-combo');
    if (cb) { cb.textContent = '🔥 连击 ' + res.combo; cb.classList.toggle('is-hot', res.combo >= 3); }
    var xpEl = $('#play-xp'); if (xpEl) xpEl.innerHTML = I.bolt + ' ' + exam.meta().examXp + ' XP';
    if (Q.app && Q.app.refreshChrome) Q.app.refreshChrome();

    var btn = $('.play__submit');
    if (btn) {
      btn.disabled = false;
      btn.textContent = (s.i >= s.ids.length - 1) ? '查看结算 →' : '下一题 →';
      btn.setAttribute('data-next', '1');
      btn.classList.add('is-next');
    }
    // Boss / 模拟考不停顿，自动进入下一题
    if (!instant) setTimeout(nextOrSettle, 260);
  }

  function lockOptions() {
    var card = $('#play-card'); if (!card) return;
    card.querySelectorAll('[data-opt]').forEach(function (b) { b.classList.add('is-locked'); });
  }

  function paintFeedback(q, sel, res) {
    var card = $('#play-card'); if (!card) return;
    card.querySelectorAll('[data-opt]').forEach(function (b) {
      var k = b.getAttribute('data-opt');
      b.classList.add('is-locked');
      if (q.answer.indexOf(k) >= 0) b.classList.add('is-correct');
      else if (sel.indexOf(k) >= 0) b.classList.add('is-wrong');
    });
    card.classList.remove('fx-correct', 'fx-wrong');
    void card.offsetWidth;
    card.classList.add(res.correct ? 'fx-correct' : 'fx-wrong');

    if (!$('#play-exp')) {
      var exp = document.createElement('div');
      exp.id = 'play-exp';
      exp.className = 'play__exp ' + (res.correct ? 'is-ok' : 'is-no');
      exp.innerHTML =
        '<div class="play__exp-head">' + (res.correct ? '✅ 回答正确 · +' + res.xp + ' XP' : '📌 这题先记下来，稍后复习') + '</div>' +
        '<div class="play__exp-ans">正确答案：<b>' + esc(ansLabel(q)) + '</b>' +
          (res.correct ? '' : ' · 你的答案：<i>' + esc(q.type === 'judge' ? (sel[0] === 'T' ? '正确' : '错误') : sel.join('、')) + '</i>') + '</div>' +
        (q.explain ? '<div class="play__exp-txt">原题库解析：' + esc(q.explain) + '</div>'
                   : '<div class="play__exp-txt muted">原题库未提供解析，可先记住正确答案，并在错题本里加一条自己的记忆口诀。</div>') +
        (q.note ? '<div class="play__exp-note">📝 我的笔记：' + esc(q.note) + '</div>' : '');
      card.appendChild(exp);
      exp.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
  function buildSettlement(s) {
    var answered = s.correct + s.wrong;
    var total = s.ids.length;
    var rate = answered ? Math.round(s.correct / answered * 100) : 0;
    var firstRate = answered ? Math.round(s.firstCorrect / answered * 100) : 0;
    var secs = Math.round((Date.now() - s.start) / 1000);
    var avg = answered ? Math.round(secs / answered) : 0;
    var gained = exam.meta().examXp - (s._beforeXp || 0);
    var title, msg, emoji;

    if (s.mode === 'boss') {
      title = rate >= 80 ? 'Boss 挑战成功！' : 'Boss 战结束';
      emoji = rate >= 80 ? '🏆' : '🛡️';
      msg = rate >= 80 ? '正确率达标，今日 Boss 已被击败，明天还有新的守门人。'
                       : '距离 80% 还差一点，先把本次错题过一遍，随时可以再来一次。';
    } else if (s.mode === 'mock') {
      title = '模拟考报告';
      emoji = rate >= (s.goal || 80) ? '🎓' : '📋';
      msg = rate >= (s.goal || 80) ? '本次模拟达到你设定的目标正确率，保持这个节奏。'
                                   : '本次未达目标，报告已列出薄弱知识点，按顺序补一轮就好。';
      msg += '（本结果为自定义模拟练习，不代表正式考试成绩）';
    } else {
      title = '本组闯关结算';
      emoji = rate >= 80 ? '🏆' : '💪';
      if (rate >= 90) msg = '本组表现优秀，这批知识点已经很稳了。';
      else if (rate >= 80) msg = '状态不错，再顺手复习几道错题就更稳。';
      else if (rate >= 60) msg = '基础已经在了，建议现在就把本组错题过一遍。';
      else msg = '这组题偏难，系统已经把它们收进错题本，复习后再来一次就好。';
    }

    var weakArr = Object.keys(s.weak).sort(function (a, b) { return s.weak[b] - s.weak[a]; }).slice(0, 3);
    var weak = weakArr.length ? weakArr.map(function (k) { return esc(k) + ' × ' + s.weak[k]; }).join('　') : '本组没有出现错题';

    return '<div class="settle">' +
      '<div class="settle__emoji">' + emoji + '</div>' +
      '<h2>' + esc(title) + '</h2>' +
      '<div class="settle__rate"><b>' + rate + '%</b><span>本组正确率</span></div>' +
      '<div class="settle__grid">' +
        sd('本组题目', total) + sd('答对', s.correct) + sd('答错', s.wrong) +
        sd('首次答对率', firstRate + '%') + sd('最长连击', s.comboMax) + sd('新增错题', s.newWrong) +
        sd('获得 XP', '+' + gained) + sd('用时', fmtClock(secs)) + sd('平均每题', avg + ' 秒') +
      '</div>' +
      '<div class="settle__weak"><b>本组薄弱知识点</b>' + weak + '</div>' +
      '<div class="settle__msg">' + esc(msg) + '</div>' +
      '<div class="settle__acts">' +
        (s.newWrong > 0 ? '<button class="btn btn--outline" data-ea="settle-review">复习本组错题</button>' : '') +
        (s.mode === 'group' ? '<button class="btn btn--primary" data-ea="settle-next">继续下一组</button>' : '') +
        (s.mode === 'boss' ? '<button class="btn btn--primary" data-ea="settle-boss">再战一次</button>' : '') +
        '<button class="btn btn--ghost" data-ea="back-exam">返回考试中心</button>' +
      '</div></div>';
  }
  function sd(k, v) { return '<div class="settle__cell"><b>' + esc(v) + '</b><span>' + esc(k) + '</span></div>'; }

  function showSettlement() {
    var s = EP.session; if (!s || s.settled) return;
    s.settled = true;
    s.timed = false;
    var answered = s.correct + s.wrong;
    var rate = answered ? Math.round(s.correct / answered * 100) : 0;
    var unlocked = [];
    if (s.mode === 'boss') unlocked = exam.recordBoss(rate) || [];

    var wrap = document.createElement('div');
    wrap.className = 'overlay overlay--center';
    wrap.innerHTML = '<div class="modal modal--lg">' + buildSettlement(s) + '</div>';
    document.getElementById('modal-root').appendChild(wrap);
    if (rate >= 80) { fx.celebrate(); fx.sfx.clear(); } else { fx.sfx.tap(); }
    unlocked.forEach(function (a, i) { setTimeout(function () { toast('解锁备考成就：' + a.icon + ' ' + a.name); }, 600 + i * 520); });
    if (Q.app && Q.app.refreshChrome) Q.app.refreshChrome();

    wrap.addEventListener('click', function (e) {
      var a = e.target.closest('[data-ea]'); if (!a) return;
      e.stopPropagation();
      var act = a.dataset.ea;
      wrap.remove();
      EP.session = null;
      if (act === 'settle-next') startSession({});
      else if (act === 'settle-review') startSession({ scope: 'wrong' });
      else if (act === 'settle-boss') startBoss();
      else goto('exam');
    }, true);
  }

  /* ============ 快速复习 ============ */
  function showQuick(kind) {
    var ids = exam.quickSet(kind);
    if (!ids.length) { toast('这个分类下还没有题目，先去闯几关吧', 'warn'); return; }
    EP.quick = { ids: ids, i: 0, kind: kind };
    renderQuick();
  }
  var QUICK_NAME = { recentWrong: '最近错题', freqWrong: '高频错题', fav: '收藏题', multi: '全部多选题', unmastered: '未掌握的题', pre10: '考前 10 分钟速览' };
  function renderQuick() {
    var q = exam.get(EP.quick.ids[EP.quick.i]);
    var pct = Math.round((EP.quick.i + 1) / EP.quick.ids.length * 100);
    var html = '<div class="overlay overlay--center"><div class="modal modal--lg exam-quick">' +
      '<div class="exam-quick__bar"><b>' + esc(QUICK_NAME[EP.quick.kind] || '快速复习') + '</b>' +
        '<span class="muted">' + (EP.quick.i + 1) + ' / ' + EP.quick.ids.length + '</span>' +
        '<button class="iconbtn" data-ea="quick-fav" title="收藏">' + (q.fav ? '★' : '☆') + '</button>' +
        '<button class="iconbtn" data-ea="quick-close" title="关闭">✕</button></div>' +
      '<div class="exam-quick__bar2"><i style="width:' + pct + '%"></i></div>' +
      '<div class="exam-quick__body">' +
      '<div class="exam-quick__meta"><span class="tag tag--' + q.type + '">' + typeName(q.type) + '</span><span class="muted">' + esc(q.catName) + '</span></div>' +
      '<div class="exam-quick__q">' + esc(q.q) + '</div>' +
      (q.type !== 'judge' ? '<div class="exam-quick__opts">' + (q.options || []).map(function (o) { var ok = q.answer.indexOf(o.key) >= 0; return '<div class="' + (ok ? 'is-ans' : '') + '">' + o.key + '. ' + esc(o.text) + (ok ? ' ✓' : '') + '</div>'; }).join('') + '</div>' : '') +
      '<div class="exam-quick__ans">正确答案：<b>' + esc(ansLabel(q)) + '</b></div>' +
      (q.explain ? '<div class="exam-quick__exp">原题库解析：' + esc(q.explain) + '</div>' : '<div class="exam-quick__exp muted">原题库未提供解析。</div>') +
      (q.note ? '<div class="exam-quick__note">📝 ' + esc(q.note) + '</div>' : '') +
      '</div>' +
      '<div class="exam-quick__acts">' +
        '<button class="btn btn--outline" data-ea="quick-prev"' + (EP.quick.i === 0 ? ' disabled' : '') + '>← 上一题</button>' +
        '<button class="btn btn--primary" data-ea="quick-next">' + (EP.quick.i >= EP.quick.ids.length - 1 ? '完成速览' : '下一题 →') + '</button>' +
      '</div></div></div>';
    var root = document.getElementById('modal-root');
    root.innerHTML = html;
  }

  /* ============ 事件委托 ============ */
  function bind() {

        case 'quick-close': closeModal(); break;
        case 'quick-prev': if (EP.quick && EP.quick.i > 0) { EP.quick.i--; renderQuick(); } break;
        case 'quick-next':

      else if (k === 'F' || k === 'N' || k === '2') { pick('F'); e.preventDefault(); }

    function pick(k) {
      var b = document.querySelector('.play [data-opt="' + k + '"]');
      if (b && !b.classList.contains('is-locked')) b.click();

  }
  function closeModal() {

          '<div class="field"><label>记忆口诀 / 易错提醒</label>' +

      '</div>'
    );
    var ta = api.find('#exam-note-ta');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
    var ok = api.find('#exam-note-ok');
    if (ok) ok.addEventListener('click', function () {
      var v = ta ? ta.value.trim() : '';
      exam.setNote(idx, v, 'note');

      toast(v ? '笔记已保存' : '笔记已清空');
      repaint();

  function handlePlayClick(e) {
    var opt = e.target.closest('[data-opt]');
    if (opt) {
      var s = EP.session; if (!s) return;
      if (opt.classList.contains('is-locked')) return; // 已提交，锁定
      var k = opt.getAttribute('data-opt');
      var q = exam.get(s.ids[s.i]);
      s.sel = s.sel || [];
      fx.sfx.tap();
      if (q.type === 'multi') {
        var i = s.sel.indexOf(k);
        if (i >= 0) s.sel.splice(i, 1); else s.sel.push(k);

      } else {

    var sub = e.target.closest('[data-submit]');
    if (sub) {
      if (sub.hasAttribute('data-next')) nextOrSettle();
      else submitCurrent();

  /* ============ 注册到全局渲染 ============ */
  Q.epages = {
    renderExam: renderExam, renderPlay: renderPlay, bind: bind,
    startSession: startSession, startBoss: startBoss, showQuick: showQuick,
    repaint: repaint,

    hasSession: function () { return !!EP.session; }

  if (Q.pages && Q.pages.render) {

    (Q.ui && Q.ui.I) || {}

    if (s.remain <= 0) { toast('时间到，进入结算', 'warn'); showSettlement(); }

/* ============================================================
   ai.js — AI 助手模块（离线优先 + 可选联网）
   - 设置（平台/模型/API 地址/Key）只存在用户浏览器 localStorage，不进仓库、不上云
   - 安全红线：apiKey 只作为 Bearer 头发给「用户自己填写的官方 endpoint」，
     绝不写入消息体、绝不打印到控制台、绝不在 UI 中完整显示
   - 离线优先：闯关陪练 / 任务规划 完全本地（engine + exam 数据）；
     通用问答在有 Key 时调用云端，无 Key 时提示离线模式
   ============================================================ */
(function (global) {
  'use strict';

  var Q = global.Q || (global.Q = {});

  // 仅本地：键名固定，但内容（尤其 apiKey）绝不出现在源码里
  var LS_KEY = 'questly-ai-v1';

  function blank() { return { platform: '', model: '', apiUrl: '', apiKey: '' }; }

  function load() {
    try {
      var raw = global.localStorage.getItem(LS_KEY);
      if (!raw) return blank();
      var s = JSON.parse(raw) || {};
      return {
        platform: s.platform || '',
        model: s.model || '',
        apiUrl: s.apiUrl || '',
        apiKey: s.apiKey || ''
      };
    } catch (e) { return blank(); }
  }

  var settings = load();

  function save(s) {
    settings = {
      platform: (s.platform || '').trim(),
      model: (s.model || '').trim(),
      apiUrl: (s.apiUrl || '').trim(),
      apiKey: (s.apiKey || '').trim()
    };
    try { global.localStorage.setItem(LS_KEY, JSON.stringify(settings)); } catch (e) {}
  }

  function clear() {
    settings = blank();
    try { global.localStorage.removeItem(LS_KEY); } catch (e) {}
  }

  function get() { return Object.assign({}, settings); }
  function hasCloud() { return !!settings.apiUrl && !!settings.apiKey; }

  // 掩码：只显示首尾，UI 中绝不出现完整 key
  function maskKey(k) {
    if (!k) return '';
    if (k.length <= 6) return '•'.repeat(k.length);
    return k.slice(0, 4) + '…' + k.slice(-4);
  }

  /* ---------------- 云端对话（安全发送） ---------------- */
  // userText: 用户问题；opts.system 可选系统提示；opts.maxTokens 限制长度
  // 返回 Promise<string>；失败时 reject({ offline?, message })
  function chat(userText, opts) {
    opts = opts || {};
    return new Promise(function (resolve, reject) {
      if (!hasCloud()) {
        reject({ offline: true, message: '尚未配置 API，当前为离线模式。点击右上角齿轮填写后可使用联网问答。' });
        return;
      }
      // 关键：apiKey 只作为 Authorization 头发送，绝不进入消息体
      var url = settings.apiUrl;
      var messages = [];
      if (opts.system) messages.push({ role: 'system', content: opts.system });
      messages.push({ role: 'user', content: userText });
      var body = {
        model: settings.model || 'gpt-4o',
        messages: messages,
        temperature: 0.7
      };
      if (opts.maxTokens) body.max_tokens = opts.maxTokens;

      fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + settings.apiKey
        },
        body: JSON.stringify(body)
      }).then(function (r) {
        if (!r.ok) {
          return r.text().then(function (t) {
            throw new Error('HTTP ' + r.status + (t ? ' · ' + t.slice(0, 140) : ''));
          });
        }
        return r.json();
      }).then(function (data) {
        // 兼容 OpenAI / DeepSeek / 通义千问 等 chat/completions 响应
        var content = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ||
          (data.output && data.output.text) ||
          (data.result) || '';
        if (!content) throw new Error('返回结果缺少内容字段，请检查模型/接口格式');
        resolve(String(content).trim());
      }).catch(function (err) {
        // 注意：err.message 可能含网关信息，但不含 apiKey（key 只在请求头）
        reject({ message: err.message || '网络异常，请检查 API 地址与网络' });
      });
    });
  }

  function test() {
    return chat('ping（仅连接测试，请直接回复 ok）', {
      maxTokens: 8,
      system: '你是连接测试助手，收到任何消息只回复 ok 两个字，不要多余内容。'
    }).then(function (txt) {
      return { ok: true, message: '连接成功 ✓ ' + txt.slice(0, 30) };
    }).catch(function (e) {
      return { ok: false, message: e.offline ? '尚未配置 API' : (e.message || '连接失败') };
    });
  }

  /* ---------------- 本地：闯关陪练 ---------------- */
  function examCoach() {
    var exam = Q.exam;
    if (!exam || !exam.ready || !exam.ready()) {
      return { ok: false, message: '题库尚未加载，请先进入「考试闯关」等其就绪后再试。' };
    }
    var list = exam.all ? exam.all() : [];
    var meta = exam.meta();
    var c = exam.counts ? exam.counts() : null;
    var total = list.length;
    var answered = list.filter(function (q) { return q.answered; }).length;
    var mastered = list.filter(function (q) { return q.mastered; }).length;
    var wrong = list.filter(function (q) { return q.inWrong; }).length;
    var weak = list.filter(function (q) { return q.answered && !q.mastered && !q.inWrong; }).length;
    var notDone = total - answered;

    var tips = [];
    tips.push('📊 总进度：' + answered + '/' + total + ' 题已做，已掌握 ' + mastered + ' 题' +
      (c ? '（正确率 ' + (c.rate || 0) + '%）' : '') + '。');
    if (wrong > 0) tips.push('🔧 你有 ' + wrong + ' 道错题待清，建议先进「错题本」逐题攻破，错一题清一题。');
    if (weak > 0) tips.push('🌱 ' + weak + ' 道题做过但未掌握，是「差一口气的薄弱点」，适合二刷巩固。');
    if (notDone > 0) tips.push('📝 还有 ' + notDone + ' 题未碰，建议每天定量推进（如 20–30 题），避免考前突击。');
    if (meta && meta.bossDone) tips.push('🛡️ Boss 战已通关（最佳正确率 ' + (meta.bossBestRate || 0) + '%），保持手感即可。');
    if (meta && meta.star3) tips.push('🌟 已达成三星通关，状态拉满。');
    if (tips.length <= 1) tips.push('🎉 全部题目已掌握，节奏保持住就好。');
    return { ok: true, tips: tips };
  }

  /* ---------------- 本地：任务规划 ---------------- */
  function taskPlan() {
    var engine = Q.engine;
    if (engine && engine.planExisting) return engine.planExisting();
    return { ok: false, message: '规划引擎未就绪。' };
  }

  Q.ai = {
    get: get,
    save: save,
    clear: clear,
    hasCloud: hasCloud,
    maskKey: maskKey,
    chat: chat,
    test: test,
    examCoach: examCoach,
    taskPlan: taskPlan
  };
})(window);

(function (global) {

  var I = ui.I, esc = ui.esc;

  // 底部/侧边导航里可见的页面（examPlay 是沉浸答题页，不出现在导航里）

  function render(route, quiet) {

    if ((route === 'exam' || route === 'examPlay') && Q.exam && !Q.exam.ready()) {
      Q.exam.init().then(function () {
        if (current === 'exam' || current === 'examPlay') render(current, true);
      });
    }

    // 保存输入焦点
    var act = document.activeElement;
    var focusId = act && act.id ? act.id : null;
    var caret = act && act.selectionStart != null ? act.selectionStart : null;

    ROUTES.forEach(function (r) {
      var el = document.getElementById('page-' + r);
      if (!el) return;

        el.hidden = false;
